{n:124,q:"Your test generation produces unit tests for new code, but reviews show 55% are low-value: trivial assertions that only verify functions do not throw exceptions, tests duplicating existing coverage, or tests ignoring your team's fixture conventions. How do you reduce the rate of low-value tests being generated in the first place?",
o:["Document testing standards in CLAUDE.md including valuable test criteria, available fixtures with intended use cases, and examples distinguishing meaningful behavioral tests from trivial assertions.","Restrict test generation to directories where historical quality metrics show higher acceptance rates, disabling it for areas where generated tests consistently require heavy editing.","Implement a two-phase generation where a second Claude call scores each test against quality criteria, filtering out low-scoring tests before presenting results to developers.","Add post-generation coverage analysis that automatically filters out any generated test that does not increase line coverage beyond what existing tests provide."],
a:0,
e:"“In the first place” means fix the input context: quality criteria, the fixtures that exist, and examples of good vs trivial tests. The other options filter or avoid low-value output after generating it."},

{n:125,q:"Your automated review CI jobs take 18 seconds to initialize before Claude begins analyzing code. Profiling reveals the delay comes from auto-discovery of hooks, MCP servers, plugins, skills, and multiple nested CLAUDE.md files throughout your monorepo. You need to cut startup time while ensuring reviews still enforce your team's coding standards, which are documented in your root-level CLAUDE.md file. What is the most effective approach?",
o:["Replace the default prompt entirely using --system-prompt-file ./CLAUDE.md, which bypasses default prompt assembly and loads only your project rules.","Run with --bare mode and pass --append-system-prompt-file ./CLAUDE.md to explicitly load your project standards while skipping all auto-discovery.","Run with --bare mode and specify all review criteria directly in the -p prompt argument for each CI invocation, without referencing any external files.","Keep the default initialization and add --exclude-dynamic-system-prompt-sections to reduce per-machine prompt variability and improve prompt cache hit rates."],
a:1,
e:"Bare mode skips auto-discovery (the 18 seconds), and appending the root CLAUDE.md restores your standards while keeping Claude Code's built-in tool guidance. A replaces the default prompt and loses that guidance, and C duplicates the standards into every invocation."},

{n:126,q:"Your automated code review is missing genuine bugs in pull requests. Investigation reveals that your review prompt includes the instruction: “Only flag critical issues that would definitely cause production failures. Ignore minor concerns and anything you're uncertain about.” Developers confirm that some missed bugs are real logic errors the model investigated but chose not to report. The team requires that review output remain structured (each finding tagged with metadata) and actionable. Which prompt change both removes the cause of the suppressed findings and preserves structured, tagged output for downstream filtering?",
o:["Add a second review pass that re-reads the diff using the same prompt, looking for anything the first pass may have missed.","Enable extended thinking and instruct the model to reason step-by-step about each code change before producing its review.","Remove all severity-related instructions from the prompt and let the model use its default judgment about what to report.","Instruct the model to report all findings with a confidence level and severity tag, deferring filtering to a downstream step."],
a:3,
e:"Separate detection from filtering: have the model report everything with confidence and severity metadata, then filter in code. A repeats the same suppression, and C removes the tagging the team requires."},

{n:127,q:"During initial testing of the automated review pipeline, you notice that reviews on large PRs (50+ changed files) sometimes take over 20 minutes and cost $8-12 per run due to extensive agentic loops – Claude reads files, runs analysis tools, and iterates many times. Your team needs each invocation to abort once it reaches a fixed iteration count and a fixed dollar amount, enforced by Claude Code itself rather than the surrounding job runner. Which configuration change directly enforces both of those per-invocation caps?",
o:["Set --permission-mode dontAsk to auto-deny any tool permission requests not in the explicitly allowed set.","Add --max-turns 10 --max-budget-usd 2.00 to the claude -p invocation to cap iterations and spend.","Switch the --model flag to a smaller, cheaper model so each iteration uses fewer tokens and lower per-call cost.","Set timeout-minutes: 5 on the GitHub Actions job step and monitor per-run costs via the Anthropic Console usage dashboard."],
a:1,
e:"Two caps, two flags, both enforced inside Claude Code. A cheaper model lowers cost without capping it, and a job timeout is enforcement by the runner, which the question rules out."},

{n:128,q:"Your organization has enabled Claude's managed Code Review (via the Claude GitHub App) on this repository, and reviews run automatically on each PR. Reviews average 18 findings per PR. Developer feedback reveals three categories of unwanted noise: (1) style and formatting issues already enforced by your linter in CI, (2) findings on auto-generated template code under src/gen/, and (3) rendering helper patterns that are intentional project conventions but get flagged because they resemble common anti-patterns. Only about 4 findings per PR are genuine logic bugs. What is the most effective way to reduce this noise while preserving detection of real issues?",
o:["Create a REVIEW.md at the repository root with skip rules for CI-enforced checks and generated files, and a verification requirement that rendering-related findings must cite a specific line demonstrating incorrect behavior.","Add custom review instructions to a GitHub Actions workflow file, using the action's prompt parameter to suppress lint-duplicate findings, ignore generated template code, and apply stricter evidence requirements for rendering-related issues.","Add detailed explanations to the project's CLAUDE.md describing which patterns are intentional, that linting is handled separately by CI, and that the src/gen/ directory contains autogenerated template code.","Configure separate GitHub Action workflow files for each code area, one for generated code with findings suppressed, one for rendering code with custom review instructions, and a general workflow for everything else."],
a:0,
e:"Managed Code Review reads its review configuration from REVIEW.md, so that is where skip rules and evidence requirements belong. CLAUDE.md targets Claude Code sessions, and the workflow-file options apply to a self-managed Action rather than the managed app."},

{n:129,q:"Your automated reviewer uses a single prompt covering security issues, API design, and business logic correctness. Your evaluation suite shows strong recall for API design findings (82%) but poor recall for business logic edge cases in quiz scoring (34%). When you add few-shot examples of logic bugs to the prompt, logic recall improves to 41% but API design recall drops to 68%. How should you address this trade-off to improve detection across both categories?",
o:["Provide the full repository as context instead of just the changed files and surrounding code, giving the model deeper visibility into business logic patterns.","Split the review into separate focused prompts – one for security and API design, another for business logic – each with dedicated examples, then consolidate findings before posting.","Upgrade to a more capable model tier, since its stronger reasoning will handle both concern types in a single prompt and eliminate the recall tradeoff.","Replace the few-shot examples with a detailed checklist of specific logic edge cases to verify, such as division-by-zero in score calculations and boundary conditions in grading thresholds."],
a:1,
e:"The measured seesaw is attention competing inside one prompt. Splitting into focused prompts, each with its own examples, removes the competition. A bigger model does not eliminate a structural trade-off."},

{n:130,q:"Your automated review calls the Claude API for each PR, using tool_use with a report_findings tool that returns a JSON array of finding objects (each with file_path, line_number, severity, category, and description). During testing on a large PR touching 30+ files, the response hits the max_tokens limit and the output is truncated mid-JSON, causing your pipeline's parser to fail. What is the most effective way to handle this?",
o:["Split the review into multiple API calls that each analyze a subset of the changed files, then merge the resulting findings arrays.","Add retry logic that detects truncated JSON and re-sends the request with instructions to report only critical and high severity findings.","Switch from tool_use to prompting Claude to return findings as a markdown list.","Increase max_tokens to the model's maximum and instruct Claude to keep finding descriptions under 50 words each."],
a:0,
e:"The output genuinely exceeds any single response, so partition the work and merge results. B and D both discard findings or just raise the ceiling until the next large PR, and C abandons structured output."},

{n:131,q:"Engineers frequently ask the agent to cross-reference code changes with Jira tickets during reviews – checking ticket descriptions, acceptance criteria, and recent comments. This currently requires manually copy-pasting content into conversations. The team wants the agent to access this standard Jira ticket data directly. What is the most effective approach?",
o:["Integrate an existing Jira MCP server that exposes tickets, comments, and metadata through discoverable tool interfaces.","Use the Bash tool with curl to call Jira's REST API, including authentication headers and parsing JSON responses inline.","Build a custom MCP server wrapping Jira's API with tools designed specifically for this team's code review workflow.","Export Jira tickets to markdown files in the repository that the agent accesses using the Read tool."],
a:0,
e:"The need is standard ticket data, so use the existing MCP server rather than building or scripting one. Build custom only when your requirements genuinely exceed what the existing integration exposes."},

{n:132,q:"An engineer who just joined the team asks the agent to help them understand the authentication and authorization architecture before making security improvements. The codebase has 800+ files across multiple services. What exploration strategy will most effectively build understanding, given Claude's built-in tools and context limits?",
o:["Read all files containing “auth”, “login”, “permission”, or “token” in their content or filename.","Use Grep to find authentication entry points, read those files, then follow imports and function calls to map the auth flow incrementally.","Launch parallel subagents to explore different services simultaneously, then synthesize their findings into an architectural overview.","Read any CLAUDE.md and README files first, then ask the engineer to specify which 10-15 files are most important for understanding the auth system."],
a:1,
e:"Find entry points, then trace the flow through imports and calls — understanding accumulates along real execution paths. Reading every matching file blows the context budget, and D asks the newcomer for knowledge they do not have."},

{n:133,q:"Your productivity agent connects to three MCP servers: an issue tracker (search_issues, get_issue, create_comment), a documentation wiki (search_docs, get_page, list_spaces), and a database explorer (run_query, get_schema, list_databases). When engineers ask cross-system questions like “What database tables are affected by the authentication refactor in PROJ-1234?”, monitoring shows the agent makes 8-10 sequential tool calls, frequently issues exploratory calls because it lacks visibility into what content each server contains, and exhausts context space before completing complex investigations. What architectural change best leverages MCP capabilities to address these issues?",
o:["Add an orchestrator that routes questions to a single server based on keywords","Expose each server's content catalog as MCP resources – issue summaries, documentation hierarchy, database schemas","Consolidate all three servers into a unified MCP server with cross-referencing capabilities","Add a prepare_investigation tool to each server that accepts a natural language question and returns relevant content summaries"],
a:1,
e:"The stated cause is no visibility into what each server contains, and MCP resources exist precisely to expose content catalogs the agent can consult before calling tools. Routing to one server breaks cross-system questions, and consolidation is a large rewrite that does not add visibility."},

{n:134,q:"You are building a security scanning workflow. When engineers need to locate all occurrences of a dangerous function like eval() across a large codebase, which tool should your agent use for content search?",
o:["Use Glob with a pattern like **/*eval* to find files, then Read each matching file.","Use Bash to run ls -R | grep eval to recursively list files containing eval.","Read the project's main entry file and follow import statements to trace where eval might be used.","Use Grep to search for the pattern “eval(” across all files in the codebase."],
a:3,
e:"Grep searches file contents, which is what “content search” means. Glob matches filenames, and ls -R | grep filters the file listing, not the code inside the files."}
];

/* Corrections applied after checking every key against Anthropic's
   documentation and the MCP specification (August 2026). These are the
   answers this app scores against. */
(function(){
  var P = {

  66:{ a:3,
    e:"Direct execution. A clear stack trace pointing at a specific function means the entry point is known and the scope is one file — Anthropic's plan-mode guidance uses \"a single-file bug fix with a clear stack trace\" as its canonical example of a task that does not need plan mode. Examine the trace, read the code, fix it. Unfamiliarity with the module is not the trigger for plan mode; unclear scope or a wide blast radius is. If the investigation turns up architectural ambiguity or a multi-file fix, switch to plan mode then. Compare Q53, which applies the same rule to a one-line validation change." },

  26:{ a:1,
    e:"A timeout of unknown status is exactly the case where retrying is unsafe, so the error must say so: the message communicates the uncertainty and tells the agent not to retry, which is the only thing that stops the duplicate notifications. Structured retry metadata is normally the better pattern than prose — but only when the value is right, and option A marks these timeouts as retry-safe, which would cause the very duplicates the question is trying to prevent. C actively invites a retry, and D echoes content without saying anything about status." },

  8:{ e:"Preserve the disagreement and present it structurally: established findings in one section, contested ones in another, with each source's own methodology intact. A filters out valid single-source findings before the coordinator ever sees them, B discards anything only one source covers, and D's weight-averaging invents precision neither source claimed — a peer-reviewed $35B (±$7B, 95% CI) and an industry $50B of varying methodology cannot be averaged into a meaningful number." },

  9:{ e:"The loss happens during the merge, so the contract must be a machine-readable claim-to-source mapping that synthesis is required to carry forward. Note the trap: the subagents do attach citations correctly, but as prose that gets paraphrased away when findings are combined — which is why \"they already cite properly\" is not a reason to reject A. B and C reconstruct attribution after the loss, and D injects and re-parses text prefixes, which is string-munging around the same problem." },

  23:{ e:"Selection is driven by the tool description, and here the descriptions are three words long — that is the root cause. Server-side validation (C) is a better production guardrail and worth having, but it corrects the call after the wrong tool has already been chosen. Watch the verb on these questions: \"improves tool selection\" points to the description; \"guarantees\" or \"cannot be bypassed\" points to server-side or hook enforcement." },

  38:{ e:"Progressive summarization with the recent turns verbatim shrinks the prompt without ever asking the user to repeat themselves. The 94%/6% statistics make a sliding window (D) tempting, but the question sets two goals — speed and quality, while maintaining good user experience — and D buys the first by sacrificing the second. Prompt caching does not reduce the tokens processed, so it does not address coherence." },

  44:{ e:"An explicit, unambiguous request for a human escalates immediately: no confirmation step, no retry loop, no stalling. Note that A still passes the conversation history, so it is a warm handoff — it just does not make an angry customer wait through two tool calls first. Compare Q43, where the customer expresses frustration but the fix is already in hand, and the right move is to acknowledge and offer." },

  54:{ e:"Path-scoped rules in .claude/rules/, with a paths: glob in YAML frontmatter, are the mechanism built specifically for loading guidance only when the file being edited matches — which is precisely what the question asks for. Subdirectory CLAUDE.md files also work and map neatly onto these three directories, so this is a close call, but D names the purpose-built feature. Section headers do not reduce tokens at all, and @imports load unconditionally." },

  91:{ e:"Resume to keep the 30 minutes of accumulated context, and correct the specific stale facts — two renamed utility functions do not invalidate an architectural understanding built from 47 files. Rebuilding from a summary throws away detail you already paid for. Same pattern as Q72: valid session plus a few changed files means resume and inform, not restart." },

  6:{ e:"Close the loop at the orchestration layer: the coordinator inspects synthesis output, re-delegates on the gaps, then re-runs synthesis. Documenting gaps does not fill them, broader upfront queries only lower the odds, and arming synthesis with search tools breaks role separation. Compare Q11, where an option exists for the agent that detected the gap to report it upward — when that option is on the table it beats coordinator-side inference." },

  11:{ e:"The analysis agent already knows exactly what is missing, so it should report the gaps explicitly and the coordinator should iterate until coverage is sufficient. C is the near-miss: it makes the coordinator infer gaps from output it has to interpret, and it drops the \"until sufficient\" loop. Read the option set carefully — Q6 is nearly the same scenario but has no report-upward option, so there the coordinator-side answer wins." },

  28:{ e:"Tamper-proof means the rule lives inside the tool, where no prompt can reach it. B lets the model assert its own authorization, C depends on the model picking the right tool, and D puts enforcement in a hook that then hands off to the tool doing the disbursing. Compare Q31, where a hook is the answer: there the requirement is to block and trigger an escalation, while here it is that the disbursement itself cannot be bypassed." },

  31:{ e:"Guarantees come from deterministic code, not prompting. A hook intercepts the call, blocks it, and invokes the escalation the compliance rule demands. Option A also stops the refund, but only by returning an error — nothing escalates, so the requirement is half met. Ask what the guarantee must accomplish: block only, and the logic belongs inside the tool (see Q28); block and redirect the flow, and it belongs in a hook." },

  43:{ e:"This is a frustration statement, not a direct demand for a human, and the fix is available right now — so acknowledge it, say it is resolvable, and let the customer choose. Acting without consent (A) or pressing for more detail (D) both override them. Compare Q44, where the customer states the request outright and nothing has been investigated: that one escalates immediately." },

  53:{ e:"Plan mode earns its cost when scope is unclear or the blast radius is wide. A one-line conditional in one known function is direct execution — this scenario is used in Anthropic's own material as the example of a task needing no plan mode. Pairs with Q66." }

  };

  if (window.QUESTIONS) window.QUESTIONS.forEach(function(q){
    var p = P[q.n]; if(!p) return;
    for (var k in p) q[k] = p[k];
  });
})();


</script>
<script>
(function(){
  var Q = window.QUESTIONS || [], LTR = ['A','B','C','D'];
  var KEY = 'ccaf-progress-v1', POS = 'ccaf-pos-v1';
  var state = load(KEY, {}), cur = 0, mode = 'all', listKind = 'open';
  var saved = load(POS, null);
  if (typeof saved === 'number' && saved >= 0 && saved < Q.length) cur = saved;

  function load(k, dflt){ try{ var v = JSON.parse(localStorage.getItem(k)); return v === null ? dflt : v; }catch(e){ return dflt; } }
  function put(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
  function save(){ put(KEY, state); }

  function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  function tech(s){
    return esc(s).replace(/(^|[^\w&<>\/=-])(--[a-z][a-z-]+|~?\.?[\w~\/.]*\.(?:md|json|py|ts|txt)|[a-z][a-z0-9]*(?:_[a-z0-9]+)+|CLAUDE\.md|isError|tool_use|AgentDefinitions|ClaudeAgentOptions|allowedTools|fork_session|Pydantic)/g,
      function(m,p,t){ return p+'<code>'+t+'</code>'; });
  }

  var el = {
    map:  document.getElementById('map'),
    qnum: document.getElementById('qnum'), qof: document.getElementById('qof'),
    qtext:document.getElementById('qtext'), opts:document.getElementById('opts'),
    verdict:document.getElementById('verdict'), alabel:document.getElementById('alabel'),
    atext:document.getElementById('atext'), wtext:document.getElementById('wtext'),
    prev: document.getElementById('prev'), next:document.getElementById('next'),
    clearOne: document.getElementById('clearOne'),
    listOpen: document.getElementById('listOpen'),
    listMissed: document.getElementById('listMissed'),
    lvtitle: document.getElementById('lvtitle'), lvrows: document.getElementById('lvrows'),
    lvempty: document.getElementById('lvempty'), lvclose: document.getElementById('lvclose'),
    lvstart: document.getElementById('lvstart'),
    reviewbar: document.getElementById('reviewbar'), rbtext: document.getElementById('rbtext'),
    rbexit: document.getElementById('rbexit'),
    doneLine: document.getElementById('doneLine')
  };

  /* --- jump map --- */
  Q.forEach(function(q, i){
    var b = document.createElement('button');
    b.type = 'button'; b.title = 'Question ' + q.n;
    b.setAttribute('aria-label', 'Go to question ' + q.n);
    b.addEventListener('click', function(){ go(i, 'all'); });
    el.map.appendChild(b);
  });
  var cells = el.map.children;

  function paintMap(){
    for (var i = 0; i < Q.length; i++){
      var pick = state[Q[i].n], c = '';
      if (pick !== undefined) c = pick === Q[i].a ? 'r' : 'w';
      if (i === cur) c += (c ? ' ' : '') + 'now';
      cells[i].className = c;
    }
  }

  /* --- render the current question --- */
  function render(){
    var q = Q[cur], pick = state[q.n], done = pick !== undefined, hit = pick === q.a;

    el.qnum.textContent = 'Q' + q.n;
    el.qof.textContent = 'Question ' + (cur + 1) + ' of ' + Q.length;
    el.qtext.innerHTML = tech(q.q);

    el.opts.innerHTML = '';
    q.o.forEach(function(o, i){
      var b = document.createElement('button');
      b.className = 'opt'; b.type = 'button'; b.disabled = done;
      if (done){
        if (i === pick) b.classList.add(hit ? 'picked-right' : 'picked-wrong');
        else if (i === q.a) b.classList.add('reveal');
      }
      var tag = done ? (i === q.a ? 'Correct' : (i === pick ? 'Your answer' : '')) : '';
      b.innerHTML = '<span class="ltr">' + LTR[i] + '</span><span>' + tech(o) +
                    '</span><span class="tag">' + tag + '</span>';
      b.addEventListener('click', function(){ answer(i); });
      el.opts.appendChild(b);
    });

    document.body.classList.toggle('answered', done);
    document.body.classList.toggle('hit', done && hit);
    document.body.classList.toggle('miss', done && !hit);
    if (done){
      el.verdict.textContent = hit ? 'Correct' : 'Not this one';
      el.alabel.textContent = 'Correct answer — ' + LTR[q.a];
      el.atext.innerHTML = tech(q.o[q.a]);
      el.wtext.innerHTML = tech(q.e);
    }

    var reviewing = mode !== 'all';
    document.body.classList.toggle('review', reviewing);

    if (reviewing){
      var noun = mode === 'missed' ? 'missed' : 'unanswered';
      el.prev.textContent = '← Previous ' + noun;
      el.next.textContent = 'Next ' + noun + ' →';
      el.prev.disabled = step(-1) === -1;
      el.next.disabled = step(1) === -1;

      var m = members(), at = m.indexOf(cur);
      if (m.length === 0){
        el.rbtext.innerHTML = 'Reviewing ' + noun + ' <em>— none left</em>';
      } else if (at > -1){
        el.rbtext.innerHTML = 'Reviewing ' + noun + ' <em>' + (at + 1) + ' of ' + m.length + '</em>';
      } else {
        el.rbtext.innerHTML = 'Reviewing ' + noun +
          ' <em>this one is no longer ' + noun + ' · ' + m.length + ' left</em>';
      }
    } else {
      el.prev.textContent = '← Previous';
      el.next.textContent = 'Next question →';
      el.prev.disabled = cur === 0;
      el.next.disabled = cur === Q.length - 1;
    }

    el.clearOne.disabled = !done;
    var fin = !reviewing && cur === Q.length - 1 && done;
    document.body.classList.toggle('finished', fin);
    if (fin){
      var ans = 0, ok = 0;
      Q.forEach(function(x){ if (state[x.n] !== undefined){ ans++; if (state[x.n] === x.a) ok++; } });
      el.doneLine.innerHTML = ans === Q.length
        ? 'All ' + Q.length + ' answered — <b>' + ok + ' correct</b>, ' + (ans - ok) + ' missed.'
        : 'End of the bank. <b>' + ans + ' of ' + Q.length + '</b> answered so far.';
    }
    paintMap();
  }

  function inSet(i){
    if (mode === 'missed') return isMissed(i);
    if (mode === 'open') return isOpen(i);
    return true;
  }
  function members(){
    var m = [];
    for (var i = 0; i < Q.length; i++) if (inSet(i)) m.push(i);
    return m;
  }
  function step(dir){
    for (var i = cur + dir; i >= 0 && i < Q.length; i += dir) if (inSet(i)) return i;
    return -1;
  }

  function go(i, newMode){
    if (i < 0 || i >= Q.length) return;
    if (newMode) mode = newMode;
    closeList();
    cur = i; put(POS, cur); render();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function exitReview(){ mode = 'all'; render(); }

  function answer(i){
    var q = Q[cur];
    if (state[q.n] !== undefined) return;
    state[q.n] = i; save(); render(); tally();
  }

  function clearOne(){
    var q = Q[cur];
    if (state[q.n] === undefined) return;
    delete state[q.n]; save(); render(); tally();
  }

  function tally(){
    var ans = 0, ok = 0;
    Q.forEach(function(q){ if (state[q.n] !== undefined){ ans++; if (state[q.n] === q.a) ok++; } });
    document.getElementById('sAns').textContent = ans + '/' + Q.length;
    document.getElementById('sOk').textContent = ok;
    document.getElementById('sNo').textContent = ans - ok;
    document.getElementById('sAcc').textContent = ans ? Math.round(ok / ans * 100) + '%' : '—';

    var missed = ans - ok, open_ = Q.length - ans;
    el.listMissed.textContent = 'Missed (' + missed + ')';
    el.listOpen.textContent = 'Unanswered (' + open_ + ')';
  }

  el.prev.addEventListener('click', function(){ go(mode === 'all' ? cur - 1 : step(-1)); });
  el.next.addEventListener('click', function(){ go(mode === 'all' ? cur + 1 : step(1)); });
  el.rbexit.addEventListener('click', exitReview);
  el.clearOne.addEventListener('click', clearOne);

  function isMissed(i){ var p = state[Q[i].n]; return p !== undefined && p !== Q[i].a; }
  function isOpen(i){ return state[Q[i].n] === undefined; }

  function openList(kind){
    listKind = kind;
    var test = kind === 'missed' ? isMissed : isOpen;
    var hits = [];
    for (var i = 0; i < Q.length; i++) if (test(i)) hits.push(i);

    el.lvtitle.innerHTML = (kind === 'missed' ? 'Missed questions' : 'Unanswered questions') +
      ' <em>' + hits.length + ' of ' + Q.length + '</em>';
    el.lvempty.textContent = kind === 'missed'
      ? 'Nothing missed so far. Answer some questions and anything you get wrong will collect here.'
      : 'Every question has been answered. Use New session to run the bank again.';

    el.lvrows.innerHTML = '';
    hits.forEach(function(i){
      var q = Q[i], b = document.createElement('button');
      b.type = 'button';
      b.className = 'lvrow' + (kind === 'missed' ? ' miss' : '');
      var meta = kind === 'missed'
        ? '<div class="meta">You chose <b>' + LTR[state[q.n]] + '</b> · correct is <i>' + LTR[q.a] + '</i></div>'
        : '';
      b.innerHTML = '<span class="n">Q' + q.n + '</span><span class="body"><span class="snip">' +
                    tech(q.q) + '</span>' + meta + '</span>';
      b.addEventListener('click', function(){ go(i, kind); });
      el.lvrows.appendChild(b);
    });

    el.lvstart.textContent = (kind === 'missed' ? 'Review these in order' : 'Work through these in order') + ' →';

    el.lvclose.textContent = 'Back to Q' + Q[cur].n;
    document.body.classList.add('listing');
    document.body.classList.toggle('lv-empty', hits.length === 0);
    window.scrollTo({ top: 0 });
  }

  function closeList(){ document.body.classList.remove('listing', 'lv-empty'); }

  el.listOpen.addEventListener('click', function(){ openList('open'); });
  el.listMissed.addEventListener('click', function(){ openList('missed'); });
  el.lvclose.addEventListener('click', closeList);
  el.lvstart.addEventListener('click', function(){
    var m = [], test = listKind === 'missed' ? isMissed : isOpen;
    for (var i = 0; i < Q.length; i++) if (test(i)) { m.push(i); break; }
    if (m.length) go(m[0], listKind);
  });

  /* New session: wipes every answer and returns to Q1.
     Two-step rather than confirm(), which is blocked in sandboxed frames. */
  function newSession(){
    state = {};
    try{ localStorage.removeItem(KEY); }catch(e){}
    save(); closeList(); go(0, 'all'); tally();
  }

  function armButton(btn, idle, warn, action){
    var armed = false, timer;
    function disarm(){ armed = false; btn.textContent = idle; btn.classList.remove('armed'); }
    btn.addEventListener('click', function(){
      if (!armed){
        armed = true; btn.textContent = warn; btn.classList.add('armed');
        clearTimeout(timer); timer = setTimeout(disarm, 4000);
        return;
      }
      clearTimeout(timer); disarm(); action();
    });
  }

  armButton(document.getElementById('reset'), 'New session', 'Click again to start over', newSession);
  armButton(document.getElementById('resetEnd'), 'Start a new session', 'Click again to start over', newSession);

  document.addEventListener('keydown', function(ev){
    if (ev.metaKey || ev.ctrlKey || ev.altKey) return;
    var t = (ev.target.tagName || '').toLowerCase();
    if (t === 'input' || t === 'textarea') return;
    if (ev.key === 'ArrowRight'){ ev.preventDefault(); go(cur + 1); return; }
    if (ev.key === 'ArrowLeft'){ ev.preventDefault(); go(cur - 1); return; }
    if (ev.key === 'Escape'){ if (document.body.classList.contains('listing')) closeList(); else exitReview(); return; }
    if (document.body.classList.contains('listing')) return;
    if ((ev.key || '').toLowerCase() === 'm'){ ev.preventDefault(); openList('missed'); return; }
    if ((ev.key || '').toLowerCase() === 'u'){ ev.preventDefault(); openList('open'); return; }
    var i = ['a','b','c','d'].indexOf((ev.key || '').toLowerCase());
    if (i === -1) i = ['1','2','3','4'].indexOf(ev.key);
    if (i > -1){ ev.preventDefault(); answer(i); }
  });

  render(); tally();
})();
</script>
</body>
</html>
