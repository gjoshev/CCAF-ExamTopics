<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CCA-F Question Bank — 134 questions, untimed</title>
<meta name="description" content="Untimed practice bank of 134 CCA-F scenario questions, one per page, with instant feedback and explanations.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#12181b; --paper:#f1f4f3; --surface:#ffffff; --line:#d6ddda; --line-soft:#e6ebe9;
  --muted:#5e6e73; --accent:#0f5c56; --accent-soft:#e0eeeb;
  --right:#146b46; --right-bg:#e6f3ec; --right-line:#a9d4bd;
  --wrong:#a02a20; --wrong-bg:#fbeae7; --wrong-line:#e6b3ac;
  --sans:"IBM Plex Sans",system-ui,sans-serif;
  --cond:"IBM Plex Sans Condensed","IBM Plex Sans",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,monospace;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:400 16px/1.55 var(--sans);-webkit-font-smoothing:antialiased}
code{font:500 .92em/1.4 var(--mono);background:var(--accent-soft);color:#0b4a45;padding:.08em .3em;border-radius:3px;word-break:break-word}
button{font-family:inherit;cursor:pointer}
.shell{max-width:860px;margin:0 auto;padding:0 20px}

/* ---------- header ---------- */
header{background:var(--surface);border-bottom:1px solid var(--line)}
.bar{display:flex;gap:20px;align-items:baseline;flex-wrap:wrap;padding:16px 0 14px}
h1{margin:0;font:700 20px/1.1 var(--cond);letter-spacing:-.01em}
h1 span{display:block;font:400 12px/1.4 var(--sans);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-top:3px}
.stats{display:flex;gap:18px;margin-left:auto;flex-wrap:wrap}
.stat{font:400 11px/1 var(--sans);color:var(--muted);letter-spacing:.05em;text-transform:uppercase}
.stat b{display:block;font:700 20px/1.1 var(--cond);color:var(--ink);letter-spacing:0;margin-top:4px;font-variant-numeric:tabular-nums}
.stat.ok b{color:var(--right)} .stat.no b{color:var(--wrong)}
.utils{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding-bottom:14px}
.ghost{border:1px solid var(--line);background:var(--surface);color:var(--muted);padding:7px 12px;border-radius:6px;font:500 13px/1 var(--sans)}
.ghost:hover{border-color:var(--muted);color:var(--ink)}
.ghost:disabled{opacity:.4;cursor:default}
.ghost.armed{border-color:var(--wrong);color:var(--wrong);background:var(--wrong-bg)}

/* ---------- the run map: 134 cells, click to jump ---------- */
.mapwrap{background:var(--surface);border-bottom:1px solid var(--line)}
.map{display:grid;grid-template-columns:repeat(34,1fr);gap:3px;padding:14px 0}
.map button{aspect-ratio:1;border:1px solid var(--line);background:var(--paper);border-radius:2px;padding:0;font-size:0;transition:transform .08s}
.map button:hover{transform:scale(1.5);border-color:var(--ink);z-index:2;position:relative}
.map button.r{background:var(--right);border-color:var(--right)}
.map button.w{background:var(--wrong);border-color:var(--wrong)}
.map button.now{outline:2px solid var(--accent);outline-offset:1px;border-color:var(--accent)}
.map button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ---------- review mode ---------- */
.reviewbar{display:none;align-items:center;gap:14px;flex-wrap:wrap;background:var(--accent-soft);border:1px solid #a9cfc9;border-radius:8px;padding:11px 14px;margin-bottom:20px}
body.review .reviewbar{display:flex}
.reviewbar span{font:600 13px/1.3 var(--sans);color:#0b4a45}
.reviewbar span em{font-style:normal;font-weight:400;color:#3d6b66}
.reviewbar .ghost{margin-left:auto;padding:6px 10px;font-size:12px}
.lvhead #lvstart{margin-left:auto}
.lvhead #lvclose{margin-left:0}
body.lv-empty #lvstart{display:none}

/* ---------- question ---------- */
main{padding:28px 0 40px}
.qhead{display:flex;gap:12px;align-items:baseline;margin-bottom:14px}
.qnum{font:700 12px/1 var(--cond);letter-spacing:.12em;color:var(--accent);background:var(--accent-soft);padding:6px 9px;border-radius:4px}
.qof{font:400 12px/1 var(--sans);letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.qtext{margin:0 0 20px;font-size:17px;line-height:1.6}
.opts{display:flex;flex-direction:column;gap:9px}
.opt{display:flex;gap:12px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:13px 15px;font:400 15px/1.5 var(--sans);color:var(--ink);transition:border-color .12s,background .12s}
.opt:hover:not(:disabled){border-color:var(--accent);background:#fafcfb}
.opt:disabled{cursor:default}
.opt:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ltr{flex:0 0 22px;font:600 13px/1.45 var(--mono);color:var(--muted)}
.opt.picked-right,.opt.reveal{border-color:var(--right-line);background:var(--right-bg)}
.opt.picked-right .ltr,.opt.reveal .ltr,.opt.picked-right .tag,.opt.reveal .tag{color:var(--right)}
.opt.picked-wrong{border-color:var(--wrong-line);background:var(--wrong-bg)}
.opt.picked-wrong .ltr,.opt.picked-wrong .tag{color:var(--wrong)}
.tag{margin-left:auto;flex:0 0 auto;font:600 11px/1 var(--sans);letter-spacing:.06em;text-transform:uppercase;padding-top:3px}

/* ---------- feedback ---------- */
#fb{margin-top:18px;display:none}
body.answered #fb{display:block}
.verdict{font:700 13px/1 var(--cond);letter-spacing:.1em;text-transform:uppercase;margin-bottom:10px}
body.hit .verdict{color:var(--right)} body.miss .verdict{color:var(--wrong)}
.answer{border:1px solid var(--right-line);border-left:4px solid var(--right);background:var(--right-bg);border-radius:6px;padding:14px 16px;margin-bottom:10px}
.answer .lbl{font:600 11px/1 var(--sans);letter-spacing:.09em;text-transform:uppercase;color:var(--right);display:block;margin-bottom:6px}
.why{border:1px solid var(--line);border-left:4px solid var(--muted);background:var(--surface);border-radius:6px;padding:14px 16px}
.why .lbl{font:600 11px/1 var(--sans);letter-spacing:.09em;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:6px}

/* ---------- filtered list view ---------- */
#listview{display:none;padding:28px 0 60px}
body.listing #listview{display:block}
body.listing main,body.listing .nav,body.listing .hint{display:none}
.lvhead{display:flex;gap:16px;align-items:center;margin-bottom:18px;flex-wrap:wrap}
.lvhead h2{margin:0;font:700 19px/1.2 var(--cond);letter-spacing:-.01em}
.lvhead h2 em{font-style:normal;color:var(--muted);font-weight:600}
.lvhead .ghost{margin-left:auto}
.lvrows{display:flex;flex-direction:column;gap:8px}
.lvrow{display:flex;gap:14px;align-items:flex-start;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:13px 15px;font:400 15px/1.5 var(--sans);color:var(--ink);transition:border-color .12s,background .12s}
.lvrow:hover{border-color:var(--accent);background:#fafcfb}
.lvrow:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.lvrow .n{flex:0 0 46px;font:700 12px/1.5 var(--cond);letter-spacing:.08em;color:var(--accent)}
.lvrow.miss .n{color:var(--wrong)}
.lvrow .body{flex:1;min-width:0}
.lvrow .snip{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.lvrow .meta{margin-top:5px;font:500 12px/1.4 var(--mono);color:var(--muted)}
.lvrow .meta b{color:var(--wrong);font-weight:500} .lvrow .meta i{color:var(--right);font-style:normal}
.lvempty{display:none;padding:30px;text-align:center;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:10px}
body.lv-empty .lvempty{display:block}

/* ---------- paging ---------- */
.nav{position:sticky;bottom:0;background:rgba(241,244,243,.95);backdrop-filter:blur(8px);border-top:1px solid var(--line)}
.navin{display:flex;gap:10px;align-items:center;padding:14px 0}
.next{margin-left:auto;border:1px solid var(--accent);background:var(--accent);color:#fff;padding:10px 20px;border-radius:6px;font:600 14px/1 var(--sans)}
.next:hover{background:#0c4a45}
.next:disabled{opacity:.4;cursor:default}
.done-msg{padding:26px;text-align:center;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:10px;margin-top:20px;display:none}
.done-msg p{margin:0 0 14px}
.done-msg b{color:var(--ink)}
body.finished .done-msg{display:block}
.hint{color:var(--muted);font-size:12px;padding:0 0 26px}
kbd{font:500 11px/1 var(--mono);border:1px solid var(--line);border-bottom-width:2px;background:var(--surface);border-radius:3px;padding:3px 5px}

@media (max-width:760px){
  .map{grid-template-columns:repeat(20,1fr)}
  .stats{margin-left:0;gap:14px} .stat b{font-size:18px}
  .qtext{font-size:16px}
  .navin{padding:12px 0} .next{padding:10px 16px}
  .hint{display:none}
}
@media (prefers-reduced-motion:reduce){.map button:hover{transform:none}}
</style>
</head>
<body>

<header>
  <div class="shell">
    <div class="bar">
      <h1>CCA-F Question Bank<span>134 questions · untimed · one at a time</span></h1>
      <div class="stats">
        <div class="stat">Answered<b id="sAns">0</b></div>
        <div class="stat ok">Correct<b id="sOk">0</b></div>
        <div class="stat no">Missed<b id="sNo">0</b></div>
        <div class="stat">Accuracy<b id="sAcc">—</b></div>
      </div>
    </div>
    <div class="utils">
      <button class="ghost" id="listOpen">Unanswered</button>
      <button class="ghost" id="listMissed">Missed</button>
      <button class="ghost" id="reset">New session</button>
    </div>
  </div>
</header>

<div class="mapwrap">
  <div class="shell"><div class="map" id="map" role="group" aria-label="Jump to a question"></div></div>
</div>

<section id="listview" aria-live="polite">
  <div class="shell">
    <div class="lvhead">
      <h2 id="lvtitle">Unanswered</h2>
      <button class="ghost" id="lvstart">Review these in order →</button>
      <button class="ghost" id="lvclose">Back to the question</button>
    </div>
    <div class="lvrows" id="lvrows"></div>
    <p class="lvempty" id="lvempty"></p>
  </div>
</section>

<main>
  <div class="shell">
    <div class="reviewbar" id="reviewbar">
      <span id="rbtext"></span>
      <button class="ghost" id="rbexit">Exit review</button>
    </div>

    <div class="qhead">
      <span class="qnum" id="qnum">Q1</span>
      <span class="qof" id="qof">Question 1 of 134</span>
    </div>
    <p class="qtext" id="qtext"></p>
    <div class="opts" id="opts"></div>

    <div id="fb">
      <div class="verdict" id="verdict"></div>
      <div class="answer"><span class="lbl" id="alabel">Correct answer</span><span id="atext"></span></div>
      <div class="why"><span class="lbl">Why</span><span id="wtext"></span></div>
    </div>

    <div class="done-msg" id="doneMsg">
      <p id="doneLine">That's all 134.</p>
      <button class="ghost" id="resetEnd">Start a new session</button>
    </div>
  </div>
</main>

<div class="nav">
  <div class="shell">
    <div class="navin">
      <button class="ghost" id="prev">← Previous</button>
      <button class="ghost" id="clearOne">Clear this question</button>
      <button class="next" id="next">Next question →</button>
    </div>
  </div>
</div>

<div class="shell hint">
  <kbd>A</kbd> <kbd>B</kbd> <kbd>C</kbd> <kbd>D</kbd> to answer · <kbd>←</kbd> <kbd>→</kbd> to move between questions · <kbd>M</kbd> missed list · <kbd>U</kbd> unanswered list · <kbd>Esc</kbd> to close or leave review
</div>

<script>

// CCA-F practice bank — 134 questions
// a = index of correct option (0=A). d = note where the community vote disagrees with the published key.
window.QUESTIONS = [
{n:1,q:"The synthesis agent receives summarized findings from the web search and document analysis agents, then passes a consolidated summary to the report generator. During testing, you discover the generated reports make factual claims without proper citations – the report generator cannot attribute statements to their original sources because that metadata was lost during the summarization steps. What is the most effective approach to ensure proper source attribution in the final reports?",
o:["Have the report generator query the web search agent to re-locate sources for claims in the final report.","Have each agent output structured data separating content summaries from source metadata (URLs, document names, page numbers).","Skip summarization and pass full raw outputs from web search and document analysis directly to the report generator.","Instruct the synthesis agent to embed source references inline within its summary text using a consistent citation format."],
a:1,
e:"Provenance has to survive every hop, so it must be carried as structured fields alongside the content rather than as prose the next agent might drop. Re-locating sources after the fact reinstates the same guessing problem, skipping summarization blows up context, and inline citations in free text get paraphrased away."},

{n:2,q:"After the web search agent finds 25 sources (120K tokens of raw content), the document analysis agent extracts key insights (15K tokens), and the synthesis agent produces a coherent narrative draft (3K tokens), the coordinator must pass context to the report generation agent for the final output with proper source citations. What context-passing strategy provides the best balance of completeness and efficiency?",
o:["Pass the full accumulated context from all prior agents.","Pass the synthesis draft along with a structured source index that maps key claims to their source URLs and relevant excerpts.","Pass only the synthesis draft and have a separate post-processing pipeline match claims to sources and insert citations after the report is generated.","Pass a condensed summary of all prior stages that preserves the main findings and attributes them to sources by name only."],
a:1,
e:"The draft plus a claim-to-source index gives the generator everything it needs for citations at a fraction of 138K tokens. Full context is wasteful, post-hoc matching guesses at attribution, and names alone are not citable."},

{n:3,q:"Your multi-agent research pipeline crashed after processing 12 of 28 documents. The web search agent had identified relevant sources, the document analyzer had partially completed extraction, and the synthesizer had begun pattern identification. You need to resume processing without repeating work or losing fidelity of prior findings. What state management approach best balances information fidelity with context efficiency when restoring agent state?",
o:["Have each agent persist a structured export to a known location. On resume, the coordinator loads the manifest and injects relevant state into agent prompts.","Index all agent outputs in a shared vector store. When resuming, each agent queries the store using semantic search to retrieve relevant prior findings.","Have each agent maintain its own persistent state file and reload it independently at the start of each session.","Persist the coordinator's conversation log containing all task delegations and responses, providing this to agents when resuming."],
a:0,
e:"Externalize state to durable structured files and let the coordinator re-inject the relevant slice — the coordinator stays the single point of context control. Semantic retrieval is lossy and non-deterministic for resume, independent reloads lose coordination, and raw logs are verbose and unstructured."},

{n:4,q:"You have configured the system so that all four subagents have access to the complete set of 18 tools. During testing, agents frequently call tools outside their specialization – the synthesis agent attempts web searches, and the report generator tries to analyze documents. What is the primary cause of this poor tool selection behavior?",
o:["Choosing from 18 tools instead of 4-5 relevant ones increases decision complexity beyond reliable selection thresholds.","The tool definitions consume too much context window space, leaving insufficient room for task content.","The agents' role descriptions in their system prompts conflict with having access to tools outside that role.","The coordinator cannot track which capabilities each subagent has, leading to misrouted tasks."],
a:0,
e:"Tool selection accuracy degrades as the candidate set grows; the fix is scoping each subagent to only the tools it needs. Token cost is a side effect, not the cause, and the coordinator is not the one making these calls."},

{n:5,q:"The coordinator provides detailed step-by-step instructions to the web search subagent, specifying exact search queries, source priorities, and date filters. Production monitoring reveals three issues: (1) the subagent reports “insufficient results” rather than trying alternative approaches when pre-specified searches fail, (2) research quality drops for emerging topics that do not match expected patterns, and (3) the subagent rarely surfaces valuable tangential sources. What is the most effective way to improve subagent adaptability?",
o:["Implement a topic classification step where the coordinator categorizes requests as “well-defined” or “exploratory” and uses different instruction styles for each category.","Add explicit fallback directives to the detailed instructions: “If specified searches yield fewer than N results, attempt alternative query formulations before reporting failure.”","Remove procedural details entirely, delegating with simple goals like “research X thoroughly” and relying on the subagent's general capabilities.","Specify research goals and quality criteria (coverage breadth, source diversity, recency) rather than procedural steps, letting the subagent determine its search strategy."],
a:3,
e:"Delegate objectives and success criteria, not procedures — that is what lets a subagent adapt while still being measurable. Fallback directives patch one symptom, classification adds machinery, and bare goals with no criteria remove the quality bar entirely."},

{n:6,q:"The synthesis agent completes its initial pass but flags that three key research questions remain unanswered because the web search and document analysis agents did not find relevant information on those specific subtopics. The coordinator currently proceeds directly to report generation, producing reports with incomplete coverage. What change would most effectively improve research completeness?",
o:["Have the report generation agent note which research questions could not be answered, so users understand the limitations of the final output.","Increase the initial breadth of queries sent to web search and document analysis to reduce the probability of missing relevant information.","Have the coordinator evaluate synthesis output for gaps, then re-delegate to web search and document analysis with targeted queries before invoking synthesis again.","Give the synthesis agent direct access to web search tools so it can autonomously fill knowledge gaps without returning control to the coordinator."],
a:2,
e:"Close the loop at the orchestration layer: the coordinator inspects output, re-delegates on gaps, and re-runs synthesis. Documenting gaps does not fill them, broader upfront queries only lower the odds, and arming synthesis with search tools breaks role separation."},

{n:7,q:"The web search agent has gathered several relevant sources for a research topic. The document analysis agent now needs to examine these sources. How does information typically flow between these two specialized subagents?",
o:["The agents communicate through an event-driven message queue, with the document analysis agent subscribing to web search completion events.","The web search agent directly invokes the document analysis agent, passing the discovered sources as parameters.","The coordinator agent receives the web search agent's output and includes relevant findings in the prompt when invoking the document analysis agent.","Both agents access a shared memory store where the web search agent writes findings and the document analysis agent reads them."],
a:2,
e:"Subagents do not talk to each other. All context flows through the coordinator, which collects one subagent's output and puts the relevant parts into the next subagent's prompt. This hub-and-spoke shape is the core fact behind many questions in this domain."},

{n:8,q:"Production reviews reveal inconsistent handling of uncertainty in final reports. Sometimes conflicting subagent findings are synthesized into a single confident statement (losing nuance), while other times reports over-hedge with excessive qualifications (becoming unhelpful). When the web search agent returns “industry analysts estimate $50B market size (methodology varies)” and the document analysis agent returns “peer-reviewed study estimates $35B (±$7B, 95% CI),” the coordinator either picks one arbitrarily or produces vague statements like “the market may be $35B-$50B depending on factors.” What systematic approach best addresses this?",
o:["Configure subagents to only report findings meeting a high-confidence threshold, filtering uncertain information before it reaches the coordinator.","Add a verification subagent that cross-references findings across sources, only passing claims to synthesis that are corroborated by at least two independent sources.","Instruct the synthesis agent to structure reports with explicit sections distinguishing well-established findings from contested ones, preserving original source characterizations and methodological context.","Implement a confidence calibration layer that normalizes subagent uncertainty expressions to standardized probability scores (0.0-1.0), then weight-average findings by their calibrated confidence."],
a:2,
e:"Preserve the disagreement and present it structurally: established vs contested, with each source's own methodology intact. Filtering and two-source corroboration destroy legitimate single-source findings, and numeric calibration invents precision the sources never had.",
d:"Community vote is split three ways (C / B / D). The published key is C."},

{n:9,q:"In production, final reports frequently contain claims without proper source attribution. Investigation shows that while the web search and document analysis agents correctly attach citations to their outputs, the synthesis agent loses track of which sources support which conclusions when combining findings. What is the most effective architectural change?",
o:["Require all subagents to output structured claim-source mappings that the synthesis agent must preserve and merge when combining findings from multiple sources.","Maintain complete transcripts of all subagent interactions and add a citation-resolution agent to analyze logs and determine attributions before report generation.","Add a verification step where the report generator uses semantic similarity matching against original sources to reconstruct which claims came from which documents.","Have the coordinator inject source identifier prefixes into text before each handoff, then parse these prefixes at report generation to reconstruct citations."],
a:0,
e:"The loss happens during merge, so the contract must be a machine-readable claim-to-source mapping that synthesis is required to carry forward — not prose citations it can paraphrase away. Log analysis and similarity matching are both reconstruction after the loss.",
d:"Some commenters argue for D, on the grounds that the subagents already cite correctly. The published key is A: the existing citations are prose, not a structured mapping synthesis can merge."},

{n:10,q:"After the web search agent and document analysis agent complete their tasks, the coordinator invokes the synthesis agent. However, the synthesis agent responds that it cannot complete the task because no research findings were provided. What is the most likely cause of this issue?",
o:["The subagents need to share a single API connection to enable automatic context sharing between invocations.","The synthesis agent needs tools that can fetch results directly from the other agents' conversation histories.","The coordinator did not include the outputs from the previous agents in the synthesis agent's prompt.","The synthesis agent's context window is not large enough to hold the combined outputs from both previous agents."],
a:2,
e:"Subagents start with clean context and inherit nothing automatically. If the coordinator does not put prior outputs in the prompt, the synthesis agent genuinely has nothing to work with."},

{n:11,q:"Users report that final reports sometimes lack depth on specific subtopics. Investigation shows that the document analysis agent frequently identifies gaps – for instance, noting “the retrieved sources discuss API authentication but lack details on token refresh patterns” – but under the current strict pipeline, this insight is not actionable since search has already completed. What is the most effective architectural change?",
o:["Add a research planning agent before the search phase that decomposes topics into specific sub-questions.","Have the analysis agent report specific gaps to the coordinator, which triggers targeted searches and re-invokes analysis until sufficient.","Have the coordinator review analysis output for gap indicators and re-invoke search with gap-informed queries when gaps are detected.","Have the synthesis agent attach confidence scores to each section and flag areas with insufficient coverage for manual review."],
a:1,
e:"The analysis agent already knows exactly what is missing, so it should report gaps explicitly and the coordinator should iterate until coverage is sufficient. C is close but makes the coordinator infer gaps from output it has to interpret, and drops the “until sufficient” loop."},

{n:12,q:"After the web search and document analysis subagents complete their tasks, the coordinator needs to spawn the synthesis subagent to synthesize the findings. What is the correct approach for providing the synthesis subagent with the information it needs?",
o:["Spawn the subagent with only a brief task description, relying on automatic context inheritance from the coordinator.","Provide the subagent with tool definitions that allow it to request outputs from other subagents via callbacks.","Pass reference identifiers and configure the subagent with read access to a shared memory store where other subagents deposited their results.","Include the complete findings from both subagents directly in the synthesis subagent's prompt."],
a:3,
e:"Subagents do not inherit the coordinator's context or see each other's outputs. Everything needed goes into the prompt explicitly."},

{n:13,q:"When the agent calls lookup_order and receives order details showing the item was purchased 45 days ago, how does the agentic loop determine whether to call process_refund or escalate_to_human next?",
o:["The orchestration layer automatically routes to the next tool based on the order's status field.","The order details are added to the conversation and the model reasons about which action to take.","The agent executes the remaining steps in a tool sequence planned at the start of the request.","The agent follows a pre-configured decision tree mapping order attributes to specific tool calls."],
a:1,
e:"The loop is: tool result goes back into the conversation, the model reads it and decides the next action. There is no pre-planned sequence and no routing layer making the decision."},

{n:14,q:"After investigating a billing dispute over 25+ turns, you have identified that duplicate charges occurred due to a payment gateway timeout triggering retry logic. The required refund ($847) exceeds your $500 authorization limit. You need to call escalate_to_human, and the human agent will not have access to your conversation transcript. What context should you pass to enable effective resolution?",
o:["A structured summary: customer ID, root cause, refund amount, and recommended action.","Your diagnosis and the refund amount only.","The customer's original complaint verbatim plus the tool result excerpts showing duplicate transactions.","The complete conversation transcript with all tool results."],
a:0,
e:"A structured handoff gives the human everything actionable without making them re-read 25 turns. Raw transcripts shift the work rather than doing it; diagnosis alone omits the identifiers needed to act."},

{n:15,q:"Your agent is handling a billing dispute. After calling get_customer and lookup_order, it identifies that the dispute involves a promotional pricing error requiring manager approval – beyond the agent's authorization level. How should the workflow handle this mid-process escalation?",
o:["Compile a structured handoff with customer details, order info, and the identified issue before calling escalate_to_human.","Persist the complete conversation and tool response history to a database, then call escalate_to_human with a reference ID.","Call escalate_to_human passing only the customer's original message.","Attempt the refund with process_refund anyway, escalating only if the system rejects the transaction."],
a:0,
e:"Warm handoff: package what you learned into a structured summary before escalating. A reference ID makes the human go dig; the original message alone discards your investigation; attempting an unauthorized action is a policy violation."},

{n:16,q:"You are implementing the escalation logic for when the agent should call escalate_to_human. Your team proposes four different approaches for triggering escalation. Which approach will most reliably identify cases that genuinely require human intervention?",
o:["Implement sentiment analysis that monitors for frustration indicators (negative language, repeated questions, exclamation marks) and trigger escalation when the frustration score exceeds a configured threshold.","Configure the agent to escalate after three consecutive tool calls that fail to resolve the customer's stated issue, ensuring a reasonable attempt before involving a human.","Instruct the agent to escalate when the customer requests a human, when the issue requires policy exceptions, or when the agent cannot make meaningful progress.","Build a rules engine that maps specific issue types, customer segments, and product categories to escalation decisions, removing the need for model judgment calls."],
a:2,
e:"Escalate on the three real conditions: explicit request, policy exception needed, or no meaningful progress. Sentiment proxies and fixed retry counts fire on the wrong signal, and a rules engine cannot enumerate the space."},

{n:17,q:"Your order management system requires tools for three distinct operations: issuing refunds (requires amount and reason), canceling orders (requires reason), and requesting reshipments (requires shipping address). Each operation shares an order_id parameter but has different additional requirements. You notice during testing that with your current unified tool design, the agent frequently omits required parameters or includes irrelevant ones. What design change will most effectively improve parameter accuracy?",
o:["Keep one unified tool with a nested operation_details object parameter whose internal structure varies by operation type, documented in the tool description.","Keep one unified tool but add JSON Schema if-then-else conditionals to enforce that parameters like amount are required only when the operation type is “refund”.","Split into three separate tools (issue_refund, cancel_order, request_reshipment), each defining only the parameters required for that specific operation.","Keep one unified tool with all parameters marked optional, but add detailed few-shot examples in the system prompt showing correct parameter combinations for each operation type."],
a:2,
e:"One tool per operation makes required parameters unconditionally required, which is what the model reads reliably. Conditional schemas and prose descriptions leave the model inferring which fields apply."},

{n:18,q:"Your post_content tool requires user confirmation before publishing. The current workflow displays “Ready to post to social media. Confirm?” and analytics show users approve 98% of requests within 2 seconds. Post-mortems reveal incidents where posts went to wrong accounts, were scheduled for wrong times, or contained errors – all confirmed by users without catching the mistakes. How should you redesign the confirmation workflow?",
o:["Auto-approve routine posts and only require explicit confirmation for unusual patterns like posting to new accounts or large audiences","Require users to type a confirmation phrase instead of clicking a button","Add a mandatory waiting period before the confirm option becomes available","Include the complete post text, target account, scheduled time, and platform in the confirmation request"],
a:3,
e:"People cannot catch errors they cannot see. Show the full consequential details in the confirmation. Friction devices (typed phrases, delays) make users slower without making them informed."},

{n:19,q:"Your agent uses three tools: get_property_details(property_id) returns data including street address, get_price_history(property_id) returns historical pricing, and get_neighborhood_info(address) returns area statistics. You observe that get_neighborhood_info always requires get_property_details first just to extract the address, even when users specify the property by ID. This creates unnecessary latency and failure coupling – if the first call fails, the neighborhood request also fails. What tool design change best addresses this?",
o:["Create a lookup_address(property_id) helper tool for retrieving addresses.","Add retry logic and timeout handling to get_property_details.","Change get_neighborhood_info to accept property_id, resolving the address internally.","Consolidate into a single get_property_with_neighborhood(property_id) tool returning both datasets."],
a:2,
e:"Align tool inputs with the identifier the agent actually has, and resolve the internal detail server-side. A helper tool keeps the two-call chain; consolidation removes the ability to fetch neighborhood data alone."},

{n:20,q:"Your update_user_profile tool accepts a user_id (required) and an optional fields_to_update object. In testing, Claude frequently omits user_id or passes incorrectly structured data. What is most critical for helping Claude understand what parameter values to provide?",
o:["Strict JSON Schema type constraints marking user_id as required and defining fields_to_update as an object type","Verbose parameter names encoding format hints, such as user_id_string_uuid_format","Detailed error responses explaining why invalid parameter values were rejected","Clear parameter descriptions explaining expected format, such as “user_id: UUID of the user to update (required)”"],
a:3,
e:"The model chooses values from the semantic descriptions. Schema types constrain shape but cannot express “which UUID, from where, in what format”; error responses only help after a failed call."},

{n:21,q:"Your document extraction tool uses ML models to extract invoice fields (vendor, amount, date). The models return confidence scores (0.0-1.0) for each extracted field. In production, you observe: (1) the agent proceeds with low-confidence extractions that are incorrect 23% of the time, and (2) the agent requests unnecessary human review for 31% of extractions that were actually correct. How should you restructure the tool's output?",
o:["Return fields with their raw confidence scores and add detailed few-shot examples to your system prompt demonstrating how to interpret different confidence ranges and when to request human review.","Return fields with confidence scores, plus a request_review boolean computed using your tested confidence thresholds, along with a review_reasons array explaining which fields triggered review.","Compute an aggregate extraction_quality score across all fields and return it alongside the extracted values. Include a text summary describing the overall extraction reliability.","Return fields organized into verified and needs_verification objects based on confidence thresholds."],
a:1,
e:"Move the threshold decision into the tool, where it can be tested and tuned, and hand the agent an explicit boolean plus reasons. Raw scores leave the model guessing at cutoffs; an aggregate score loses field-level detail; D omits the reasons the agent needs to explain itself."},

{n:22,q:"Your product search tool queries an external catalog API and returns matching items. In production, you observe the agent frequently retries searches immediately after receiving zero results, treating “no matches found” as a failure requiring retry. The external API returns HTTP 200 with an empty results array – a valid response. How should you restructure the tool's result to help the agent correctly interpret empty result sets?",
o:["Add a suggestions field containing alternative search strategies when results are empty, helping guide the agent toward more productive follow-up queries.","Return a natural language string describing the outcome, allowing the agent to interpret the result contextually based on the message content.","Return a result object with isError: true and a message explaining no products matched.","Return a structured result with a success boolean and results array, reserving isError: true for actual execution failures only."],
a:3,
e:"Zero results is a successful execution, so isError must stay false. Marking it as an error is exactly what triggers retries. Suggestions are a nice addition but do not fix the miscategorization."},

{n:23,q:"Your MCP server includes archive_file(file_id) and delete_file(file_id) tools. Production logs show the agent calls delete_file when users ask to “remove old backups,” but company policy requires archiving backup files. Both tools currently have minimal descriptions: “Archives a file” and “Deletes a file.” Which change most directly improves tool selection for this scenario?",
o:["Expand tool descriptions to clarify use cases, adding guidance like “Do not use for backup files” to delete_file.","Add a confirmation step that requires users to type “CONFIRM DELETE” before delete_file executes.","Implement server-side validation that rejects delete_file calls for files tagged as backups, returning an error message suggesting archive_file.","Add few-shot examples to the system prompt demonstrating that requests involving “backup” or “old” should use archive_file."],
a:0,
e:"The question asks what most directly improves tool selection, and selection is driven by the description. The minimal descriptions are the root cause. Server-side validation is a good guardrail but corrects the call after the wrong selection has already happened.",
d:"Community vote is split 50/50 between A and C. The published key is A — note the phrase “improves tool selection.”"},

{n:24,q:"Your track_shipment(tracking_id) tool queries an external logistics API that sometimes fails – the API may be temporarily unavailable, the tracking ID may be malformed, or the shipment may not exist. Currently, your tool raises a Python exception when errors occur. Users report the agent gives unhelpful responses like “I'm having trouble with that request” instead of suggesting alternatives such as verifying the tracking number format or checking by order number. How should you handle errors in tool results?",
o:["Return a generic error response (e.g., {“success”: false, “error”: “lookup_failed”}) for all failure cases to maintain a consistent schema and avoid exposing internal error details.","Return structured error information as normal tool output including error type, recoverability status, and actionable context for the user.","Create dedicated error-recovery tools (retry_tracking_lookup, search_by_order_number) that the model can invoke after the primary tracking tool returns a failure indicator.","Implement retry logic with exponential backoff inside the tool implementation so transient errors are automatically handled and only return a result after all retry attempts are exhausted."],
a:1,
e:"Errors are information the model needs to choose a recovery path, so return them as structured tool output with type, recoverability, and next steps. Generic errors and swallowed retries hide exactly what the model needs."},

{n:25,q:"Your MCP server implements a check_availability tool that queries an external calendar API. During testing, you encounter three error conditions: (1) the tool is called with a malformed request missing the required user_email parameter, (2) the calendar API returns a 404 because the specified user does not exist in the calendar system, and (3) the calendar API returns a 503 because the service is temporarily unavailable. How should each error be reported according to MCP's error handling design?",
o:["Report all three as tool results with isError: true.","Report errors 1 and 2 as JSON-RPC protocol errors; report error 3 as a tool result with isError: true.","Report error 1 as a JSON-RPC protocol error; report errors 2 and 3 as tool results with isError: true.","Report all three as JSON-RPC protocol errors."],
a:2,
e:"MCP splits the two layers: protocol-level problems (malformed request, unknown tool, missing required parameter) are JSON-RPC errors; failures during correct execution (404, 503) come back as tool results with isError: true so the model can reason about them."},

{n:26,q:"Your send_notification tool calls third-party messaging APIs. When these services time out during delivery, you cannot determine whether the message was actually sent. Currently, the tool returns is_error: true with a generic “Notification failed” message for all timeouts. Production monitoring reveals agents automatically retry these failures, frequently causing users to receive duplicate notifications. How should you modify the error response?",
o:["Return is_error: true with a structured field retry_safe: true for timeouts, distinguishing them from permanent failures that should not be retried.","Return is_error: true with a message communicating uncertainty: “Timeout – status unknown. Message may have been sent. Avoid retry.”","Return is_error: true with a message encouraging retry: “Delivery service temporarily unavailable. Please retry the notification.”","Return is_error: true with the original message content echoed back."],
a:0,
e:"The published key is A: add a structured retry-safety field so the model can distinguish transient-but-retryable from unsafe-to-retry, rather than parsing prose. Note the option text says retry_safe: true, which reads oddly for a timeout of unknown status.",
d:"Community vote is 100% B, arguing that only an explicit “may have been sent, avoid retry” message prevents duplicates. Worth knowing both readings — the exam key is A (structured metadata over prose)."},

{n:27,q:"Your control_device tool manages smart home devices through external APIs. When a device does not respond within the timeout period, the tool returns an error. Production logs show that the agent simply tells users “the device is not responding” without offering helpful next steps. Which error response structure would best enable the agent to provide useful follow-up?",
o:["Set is_error: true with a structured technical error containing the device ID, timeout duration, and raw API response code for debugging purposes.","Set is_error: true with a brief “Device offline” message and provide a separate tool the agent can call to retrieve context-specific troubleshooting suggestions.","Set is_error: false with an optimistic message indicating the command was dispatched successfully but device acknowledgment is still pending.","Set is_error: true with a message explaining the likely cause and suggesting troubleshooting steps the agent can offer the user."],
a:3,
e:"Instructive error messages: say what went wrong and what to try next, in the error itself. Raw debug codes are for engineers, an extra tool call adds a round trip, and reporting success for a failure is misleading."},

{n:28,q:"Your expense reimbursement agent processes employee requests using a process_reimbursement tool. Company policy requires that reimbursements above $500 must be approved by a manager before funds are disbursed. The agent handles hundreds of requests daily, and you need the threshold enforcement to be tamper-proof regardless of how the agent is prompted. Which design ensures the $500 approval threshold cannot be bypassed?",
o:["The process_reimbursement tool accepts amount and details, and internally enforces the threshold: amounts <$500 are auto-disbursed and the tool returns a success confirmation; amounts >$500 cause the tool to create a pending approval request and return a status indicating manager review is pending.","The process_reimbursement tool accepts an approved_by_manager: boolean parameter. The system prompt instructs the agent to only set this to true after confirming that a manager has approved the request. A nightly audit script reviews all reimbursements where approved_by_manager was set to true.","Provide two tools: auto_reimburse (hard-coded limit of $500) and request_manager_approval. Include detailed system prompt instructions telling the agent to check the amount and call the appropriate tool. Add a PostToolUse hook that logs which tool was called for auditing.","Implement the threshold check in a PreToolUse hook that inspects the amount parameter before process_reimbursement executes. If the amount exceeds $500, the hook modifies the tool call to add a requires_approval: true flag, which the tool checks before disbursing."],
a:0,
e:"Tamper-proof means the rule lives inside the tool, where no prompt can reach it. B lets the model assert its own authorization, C depends on the model picking the right tool, and D puts enforcement in a hook layer outside the tool that ultimately disburses."},

{n:29,q:"Your content curation agent discovers articles, analyzes each for relevance, then adds selected articles to themed collections. With separate discover_articles(topic), analyze_article(id), and add_to_collection(article_id, collection_id) tools, you observe 18+ sequential tool calls per request, causing latency issues. The agent must make editorial judgments about which articles fit a collection's theme – this requires seeing all candidates with their analysis scores simultaneously to select a cohesive set. What tool composition best addresses efficiency while preserving editorial judgment?",
o:["Keep all tools separate but implement response caching for analyze_article calls.","Create a curate_collection(topic, collection_id) tool that handles discovery, analysis, and selection internally using configurable quality thresholds.","Create a discover_and_analyze(topic) composite tool that returns all candidates with their analysis scores, keeping add_to_collection separate for selective calls.","Add a preview_curation(topic, collection_id) tool that shows what would be added based on predefined rules, with an approve_curation() tool to confirm."],
a:2,
e:"Collapse the mechanical fan-out into one call, keep the judgment call with the model. B moves the editorial decision into thresholds, which is the one thing the requirement says to preserve."},

{n:30,q:"The document analysis agent has a single analyze_document tool that takes a document and a free-text instruction parameter. During evaluation, requests like “extract the key financial metrics” often return narrative summaries, while “summarize the methodology” sometimes returns raw data tables. The synthesis agent reports that 35% of analysis results require re-requests with clarified instructions. What is the most effective way to improve reliability?",
o:["Have the coordinator pre-classify each analysis request before passing instructions to the document analysis agent","Keep the single tool but add an analyze_type enum parameter requiring explicit selection between extraction, summarization, and verification modes","Enhance the tool description with detailed examples showing how different instruction phrasings should map to different output formats","Split the generic tool into purpose-specific tools – extract_data_points, summarize_content, verify_claim_against_source – each with defined input/output contracts"],
a:3,
e:"Free-text instructions give no output contract. Purpose-specific tools fix both the input and the output shape. An enum improves the input but still leaves one loosely-defined output format."},

{n:31,q:"Compliance requires that refunds exceeding $500 must automatically escalate to a human agent – this rule cannot be left to model discretion. Despite clear system prompt instructions, production logs show the agent occasionally processes high-value refunds directly (3% failure rate). How should you achieve guaranteed compliance?",
o:["Modify the refund tool to return an error with message “Amount exceeds policy limit – please escalate” when threshold is exceeded.","Add few-shot examples to the prompt showing correct escalation behavior at various refund amounts ($400, $500, $600).","Implement a hook to intercept tool calls; when the refund process amount exceeds $500, block it and invoke human escalation.","Strengthen the system prompt with emphatic language: “CRITICAL POLICY: Refunds over $500 MUST trigger human escalation. NEVER process these directly.”"],
a:2,
e:"Guarantees come from deterministic code, not prompting. A hook intercepts the call and blocks it before execution. Prompt emphasis and examples only reduce the failure rate."},

{n:32,q:"Production logs reveal inconsistent error handling: when lookup_order fails, the agent sometimes retries 5+ times (wasteful when the order ID does not exist), sometimes escalates immediately (premature for temporary network issues), and sometimes asks users for clarification (inappropriate when the issue is a backend permission error). Investigation shows your MCP tool returns uniform error responses: {“isError”: true, “content”: [{“type”: “text”, “text”: “Operation failed”}]}. The agent cannot distinguish between error types. What is the most effective improvement?",
o:["Create an analyze_error MCP tool the agent calls after any failure to determine the error category and recommended action.","Add few-shot examples to the system prompt demonstrating how to interpret error message patterns and select appropriate responses for each.","Enhance error responses with structured metadata: include errorCategory (transient/validation/permission), isRetryable boolean, and a description of what caused the failure.","Implement retry logic with exponential backoff in your MCP server for all errors, returning to the agent only after retries are exhausted."],
a:2,
e:"Give the model the discriminating information in the error itself: category, retryability, cause. An extra diagnostic tool adds a round trip to information the first call already had."},

{n:33,q:"When implementing your lookup_order MCP tool, the backend sometimes returns errors (e.g., “Order not found” or temporary database failures). What is the correct pattern for communicating these errors back to the agent?",
o:["Throw an exception from the tool handler so the agent framework can catch and log it","Return the error message in the tool result content with the isError flag set to true","Log the error server-side and return an empty result to avoid confusing the model","Return a success response with a “status” field indicating the error type"],
a:1,
e:"Execution failures come back as tool results with isError: true and a descriptive message, so the model can see and act on them. Throwing hides the detail, empty results are ambiguous, and mislabeling a failure as success is worse."},

{n:34,q:"Your process_refund tool returns two types of errors: technical errors (“503 Service Unavailable”, “Connection timeout”) that are transient (5% of calls), and business errors (“Order exceeds 30 day return window”, “Item already refunded”) that are permanent (12% of calls). Monitoring shows the agent wastes 3-4 turns retrying business errors that can never succeed. Currently, both error types return only a plain text message to Claude. What is the most effective way to reduce wasted retries while improving customer-facing response quality?",
o:["Implement automatic retry logic at the tool level for technical errors only, passing business errors to Claude without retries.","Add few-shot examples showing how to distinguish retriable from non-retriable errors by parsing error message text.","Return structured error responses with retriable: false for business errors and a customer-friendly explanation for Claude to use.","Add a check_refund_eligibility tool that must be called before process_refund to prevent business rule violations."],
a:2,
e:"One change fixes both problems: a structured retriable flag stops the pointless retries, and a customer-friendly explanation improves the reply. Text parsing is fragile and a pre-check tool doubles every call."},

{n:35,q:"Your get_portfolio_value tool returns the total value of a user's investment portfolio. You are deciding between returning a structured JSON object with explicit fields versus returning the information as a formatted text string. What is the primary advantage of using structured output with defined fields?",
o:["JSON schemas automatically validate that the underlying API returned correct data before the agent processes it.","Structured JSON consumes significantly fewer tokens than natural language, substantially reducing API costs.","Structured JSON is processed deterministically by the model, significantly improving accuracy when extracting values.","The agent can reliably extract specific values without parsing free-form text, reducing errors in subsequent operations."],
a:3,
e:"The benefit is reliable field access for downstream steps. JSON is often more tokens, not fewer; schemas validate shape not correctness; and the model is never deterministic."}
,
{n:36,q:"The coordinator agent has AgentDefinitions configured for all four specialized subagents, each with appropriate descriptions, prompts, and tool restrictions. During testing, you notice the coordinator correctly reasons about when to delegate – it generates messages like “I'll ask the web search agent to find sources on this topic” – but no subagent execution ever occurs. The coordinator then proceeds as if the delegation happened and continues with incomplete information. Logs show no errors. What is the most likely cause?",
o:["The coordinator's max_tokens setting is too low, causing the Task tool invocation to be truncated before the subagent type parameter can be specified.","The coordinator's allowedTools configuration does not include “Task”, so while it can reason about delegation, it cannot invoke the tool required to spawn subagents.","The AgentDefinitions are configured correctly, but the coordinator's system prompt does not explicitly list the available subagent types, preventing the model from knowing they can be invoked.","Subagent context isolation means task descriptions from the coordinator do not automatically reach subagents; you need to configure explicit context forwarding in ClaudeAgentOptions."],
a:1,
e:"Delegation happens through the Task tool. If Task is not in allowedTools, the model can talk about delegating but has no mechanism to do it — and no error is raised, which matches the clean logs."},

{n:37,q:"Your conversational assistant frequently generates multiple clarifying questions when users make ambiguous requests. When a user asks “Can you help me with the report?”, the assistant responds: “I'd be happy to help! Could you tell me: 1) Which report? 2) What kind of help – drafting, reviewing, or formatting? 3) What's your deadline?” User analytics show a 40% conversation abandonment rate after these multi-question responses. What is the most effective way to reduce friction while appropriately handling ambiguity?",
o:["Limit the assistant to one clarifying question per turn, using conversation history to accumulate answers over multiple exchanges rather than requesting everything upfront.","Add a preprocessing step using a smaller model to classify request ambiguity on a 1-5 scale, routing high-ambiguity requests to a clarification dialog and low-ambiguity requests directly to the assistant.","Modify the system prompt to instruct the assistant to make reasonable assumptions from available context, state those assumptions explicitly, and offer to adjust if the interpretation is wrong.","Create a lookup table of common request patterns with predefined default interpretations, having the assistant respond with those defaults without stating the assumptions made."],
a:2,
e:"Act on a stated assumption and offer to correct it — the user gets progress immediately. One question per turn still stalls; D hides the assumption, which is the part that makes correction possible."},

{n:38,q:"After 30+ turns, your conversational assistant shows noticeably slower responses and occasionally produces less coherent outputs. Investigation reveals: (1) average conversations reach 50,000 tokens by turn 35, (2) production logs show 94% of user messages only reference the previous 3-5 exchanges, (3) the 6% of queries referencing earlier context typically ask about information the user could easily re-state. Your goal is to improve response speed and quality while maintaining good user experience. What is the most effective approach?",
o:["Enable prompt caching and continue sending the complete conversation history, using cached prefixes to reduce per-request costs while preserving all context.","Build a retrieval system that stores all conversation turns and uses semantic search to pull in relevant historical context only when the current query appears to reference past information.","Implement a summarization layer that progressively compresses older conversation turns into a running summary while keeping the most recent 5-6 turns verbatim, maintaining full historical context in condensed form.","Implement a sliding window keeping only the system prompt and last 8-10 turns. When users reference earlier context, acknowledge the limitation and ask them to re-state the relevant information."],
a:2,
e:"Progressive summarization with recent turns verbatim shrinks the prompt without ever asking the user to repeat themselves — it satisfies both the performance goal and the user-experience constraint. Caching does not reduce tokens processed for coherence purposes.",
d:"Community vote is split 50/50 between C and D. D is defensible on the 94%/6% statistics, but it degrades UX, which the question lists as a constraint. Published key is C."},

{n:39,q:"Production monitoring shows that follow-up queries like “summarize what we learned about market trends” consistently take 40+ seconds. Investigation reveals the coordinator spawns the synthesis subagent for each summarization request, passing 80K+ tokens of accumulated findings. The coordinator already has these findings in its context from orchestrating the research. What is the most effective way to improve response time for these follow-up summaries?",
o:["Enable prompt caching on the synthesis subagent to reduce the overhead of repeatedly transferring the same research findings.","Have the coordinator handle straightforward summarization requests directly using its existing context, reserving subagent spawning for complex analysis.","Pre-generate and cache summaries at multiple granularities whenever new findings accumulate.","Spawn the synthesis subagent with reduced context and have it request specific findings from the coordinator on-demand."],
a:1,
e:"Do not delegate what you can already answer. The coordinator holds the context; spawning a subagent just re-transfers 80K tokens. Reserve delegation for work that genuinely needs an isolated context."},

{n:40,q:"A customer raises three separate issues during one session: a refund inquiry (turns 1-15), a subscription question (turns 16-30), and a payment method update (turns 31-45). At turn 48, the customer asks “What happened with my refund?” The conversation is approaching context limits. What strategy best maintains the agent's ability to address all issues throughout the session?",
o:["Extract and persist structured issue data (order IDs, amounts, statuses) into a separate context layer.","Summarize earlier turns into a narrative description, preserving full message history only for the active issue.","Rely on MCP tools to re-fetch relevant information on demand when the customer references earlier issues.","Implement sliding window context that retains the most recent 30 turns."],
a:0,
e:"Keep the durable facts — identifiers, amounts, statuses — as structured state and let the conversational filler go. Narrative summaries lose exact values, and a 30-turn window drops the refund entirely."},

{n:41,q:"During a billing dispute resolution, your agent successfully retrieves customer info via get_customer and order details via lookup_order, but when attempting to call process_refund, the tool returns a timeout error. The agent has enough information to explain the charges and verify refund eligibility, but cannot actually process the refund due to the backend failure. What approach best balances first-contact resolution with appropriate error handling?",
o:["Explain the billing, confirm refund eligibility, acknowledge the system issue preventing immediate processing, and offer escalation or retry later","Confirm the refund will be processed and close the conversation, since the system has all necessary information to complete it automatically","Implement automatic retries with exponential backoff for process_refund, keeping the conversation open until the refund is successfully processed","Escalate immediately to a human agent since the refund action cannot be completed"],
a:0,
e:"Deliver every part of the value you can, be honest about what failed, and give the customer a path forward. Never confirm an action that did not happen."},

{n:42,q:"Your agent has called lookup_order multiple times while investigating a customer's return requests. Each response includes 40+ fields (items, shipping details, payment info, status history). Tool outputs now represent the majority of the conversation's context. The customer mentions two more orders they want to discuss. What is the most effective approach before making additional lookups?",
o:["Move all tool responses to a vector database with semantic indexing, retrieving relevant portions as the conversation continues","Proceed with additional lookups without modifying the existing tool output context","Have the model generate a natural language summary of each order's key details, replacing structured responses with prose descriptions","Extract only the return-relevant fields (items, purchase date, return window, status) from each existing order response, removing verbose details"],
a:3,
e:"Prune tool results to the fields the task needs and keep them structured. Converting to prose loses precision, and a vector store is heavy infrastructure for a single session."},

{n:43,q:"A customer writes: “I've been going back and forth on this return for days. I just want to speak to someone who can actually help me.” The agent has confirmed via lookup_order that the return is straightforward – within policy and eligible for immediate processing. What should the agent do?",
o:["Process the refund via process_refund to resolve the underlying issue, then inform them it's complete","Acknowledge frustration, inform them this is resolvable now, and offer to complete it or escalate","Call escalate_to_human immediately to honor the customer's request","Ask what specifically hasn't worked in previous attempts before deciding whether to escalate or resolve automatically"],
a:1,
e:"This is a frustration statement, not a direct demand for a human, so acknowledge it, offer the immediate fix, and leave the choice with the customer. Acting without consent (A) or forcing more questions (D) both override the customer."},

{n:44,q:"A customer sends: “This is frustrating. I've explained my issue twice and nothing is being resolved. I want to talk to a real person NOW.” The agent has not yet called any tools to investigate their account. What should the agent do?",
o:["Immediately call escalate_to_human with the conversation history.","Briefly explain what the agent can help with and offer to resolve the issue quickly, escalating only if the customer repeats their request.","First call get_customer and lookup_order to gather account context, then escalate to a human agent.","Acknowledge the frustration and ask one targeted question to understand the specific issue before escalating."],
a:0,
e:"An explicit, unambiguous request for a human is honored immediately. Compare with Q43: there the customer expressed frustration and the fix was in hand; here the customer states the request directly, so deflecting or stalling for more turns is the wrong move.",
d:"Community vote is 100% C (gather context for a warm handoff first). The published key is A: an explicit human request is respected without delay."},

{n:45,q:"A customer returns 4 hours after the initial session about the same billing dispute. The previous 32-turn session contains lookup_order results showing “Status: PENDING, Expected resolution: 24-48 hours.” In testing, you observe that when resuming sessions with stale tool results, the agent often references the outdated data in responses (e.g., “I see your refund is still being processed”) even after subsequent fresh tool calls return different information. What approach most reliably handles returning customers?",
o:["Start a new session, inject a structured summary of the previous interaction (issue type, actions taken, resolution status), then make fresh tool calls before engaging.","Resume with full history but filter out previous tool_result messages before resuming, keeping only the human/assistant turns so the agent must re-fetch needed data.","Resume with full history and configure the agent to automatically re-call all previously-used tools at session start to ensure data freshness.","Resume with full history and add a system prompt instruction telling the agent to always prefer the most recent tool results when multiple calls to the same tool exist in context."],
a:0,
e:"Stale tool results in context compete with fresh ones. The reliable fix is a clean session seeded with a structured summary, then fresh calls. Prompt instructions about preferring recent results are not a guarantee."},

{n:46,q:"The agent verifies customer identity through a multi-step process before resetting passwords. During testing, you notice that after the customer answers the third verification question, the agent asks them to provide their name again, as if the earlier exchange never happened. What is the most likely cause of this behavior?",
o:["The verification tool is clearing the agent's internal state after each successful validation step.","Claude's memory retention is limited to two conversational turns by default, requiring explicit configuration to extend it.","The conversation history is not being passed in subsequent API requests.","The prompt lacks instructions telling Claude to remember information across multiple exchanges."],
a:2,
e:"The API is stateless. Memory across turns exists only because your application resends the full message history. Forgetting earlier turns almost always means the history is not being passed."},

{n:47,q:"You are building a customer support resolution agent using the Claude Agent SDK with MCP tools (get_customer, lookup_order, process_refund, escalate_to_human). After expanding with delivery-specific capabilities (check_delivery_status, contact_driver, issue_credit, apply_promo_code, update_delivery_address, reschedule_delivery), the total tool count has grown from 4 to 10. Your evaluation suite shows tool selection accuracy has dropped from 88% to 71%. Log analysis reveals the majority of errors involve the agent selecting between semantically overlapping tools — calling issue_credit when process_refund was correct, and calling check_delivery_status when lookup_order already returns the needed data. Which approach structurally eliminates the semantic overlap identified in the logs as the error source?",
o:["Enable the tool search tool with defer_loading on the six new tools, keeping the original four always loaded, so the agent dynamically discovers specialized tools only when needed.","Split the tools across two sub-agents – a “financial resolution” agent with process_refund, issue_credit and apply_promo_code, and a “delivery operations” agent with the remaining delivery tools – with a coordinator routing between them.","Add few-shot examples to the system prompt demonstrating correct selection for each ambiguous tool pair, such as showing when issue_credit applies versus when process_refund is appropriate.","Consolidate semantically overlapping tools – merge issue_credit and process_refund into a single resolve_compensation tool with an action parameter, and fold check_delivery_status into lookup_order with an optional include_tracking flag."],
a:3,
e:"“Structurally eliminates” is the tell: if two tools overlap in meaning, merge them so the ambiguous choice no longer exists. Deferred loading, sub-agent splits, and examples all leave the overlapping pairs in place."},

{n:48,q:"During testing, you find that when a customer says “I need a refund for my recent purchase,” the agent calls process_refund immediately – but populates the required order_id parameter with a plausible-looking but fabricated value instead of first calling lookup_order to retrieve the actual order ID. The refund call fails because the fabricated ID does not exist. Which change directly addresses the root cause of the agent fabricating the order_id value?",
o:["Switch tool_choice from “auto” to “any” to force the agent to make a tool call on every turn.","Update the process_refund tool description to explicitly state that order_id must be obtained from a prior lookup_order call and must never be assumed or invented.","Pre-parse incoming customer messages to extract any order IDs mentioned, and inject them into the conversation context before passing to Claude.","Add server-side validation that checks whether the order_id exists in your database before executing the refund, returning an error to the agent if not found."],
a:1,
e:"The root cause is that the description does not say where the value comes from. Stating the dependency and prohibiting invention addresses it directly. Validation catches the bad call after the fact, which is a useful guardrail but not the root cause."},

{n:49,q:"Anthropic's tool use documentation states: “Write instructive error messages. Instead of generic errors like ‘failed’, include what went wrong and what Claude should try next.” A billing dispute agent uses lookup_order, which catches all exceptions and returns a tool_result with is_error: true and the message “Tool execution failed”. Monitoring shows two failure modes: the agent retries the identical call until hitting the turn limit, or it immediately calls escalate_to_human without trying alternative tools. Which change follows the documented recommendation and gives Claude the information it needs to select the correct recovery action for each error type?",
o:["Implement retry logic with exponential backoff inside each tool implementation so transient errors are resolved transparently within the tool before any failure result is surfaced to Claude in the agentic loop.","Add an error classification step in the agentic loop that intercepts tool errors before Claude sees them, tags each as “retry,” “try_alternative,” or “escalate,” and appends that recommendation to the tool result.","Remove is_error: true and return the error details as normal tool content, so Claude reasons about the response as data rather than treating it as a flagged failure condition that biases retry behavior.","Return error-type-specific messages with is_error: true, e.g., “Order not found - try get_customer to search by phone” for data errors and “Database timeout (transient) - retry should succeed” for infrastructure errors."],
a:3,
e:"This is the documented pattern verbatim: keep is_error: true, and make the message say what happened and what to try next. B builds an interception layer to synthesize advice the tool could simply have included."},

{n:50,q:"Production logs show that when the agent handles complex billing disputes requiring 6+ tool calls, it sometimes exhausts its max_turns limit after gathering data but before completing resolution or escalating. The team's goal is to guarantee that every customer interaction ends with either a completed resolution or a human handoff, regardless of how the agent loop terminates. Which approach achieves this guarantee?",
o:["Add system prompt instructions telling the agent to call escalate_to_human with a summary of its findings whenever it determines it cannot complete resolution within its remaining actions.","Split the workflow into two sequential agent invocations – a first agent gathers information via get_customer and lookup_order, then a second agent receives that data and handles process_refund or escalate_to_human, each with separate turn budgets.","Add orchestration-layer code that checks the agent's outcome after each loop termination – if the loop ended without a completed resolution or escalation, programmatically call escalate_to_human with the accumulated conversation context and tool results.","Implement a pre-tool-use hook that counts tool invocations and terminates the loop with an automatic escalation once the agent reaches 80% of its max_turns limit."],
a:2,
e:"A guarantee that covers every termination path has to live outside the loop, in orchestration code that inspects the outcome and forces escalation. Prompting is probabilistic, and a turn-counting hook cuts the agent off early and misses non-turn-limit terminations."},

{n:51,q:"A customer contacts the agent about a warranty claim on a power drill. Resolving this requires multiple sequential tool calls: get_customer to look up their account, lookup_order to find the purchase details, and then either process_refund or escalate_to_human depending on warranty eligibility. You are implementing the agentic loop that orchestrates these steps using the Claude API. What is the primary mechanism your application uses to determine whether to continue the loop or stop?",
o:["You manually set the tool_choice parameter to “none” after the final expected tool call to force Claude to stop requesting tools.","You check whether Claude's response contains a text content block – if text is present, the agent has produced its final answer and the loop should exit.","You track the number of tool calls made and exit the loop once a preconfigured maximum is reached.","You check the stop_reason field in each API response – the loop continues while it equals “tool_use” and exits when it changes to “end_turn” or another terminal value."],
a:3,
e:"stop_reason drives the loop: keep going on tool_use, exit on end_turn or another terminal value. Text can appear alongside tool_use blocks, so B is unreliable; a call count is a safety cap, not the mechanism."},

{n:52,q:"Your team's CLAUDE.md includes a rule: “Use 4-space indentation and always run Prettier formatting.” Despite this, code reviews reveal that roughly 30% of files Claude Code generates use inconsistent formatting – sometimes 2-space indentation, sometimes missing trailing commas. Adding emphasis (“IMPORTANT: You MUST use Prettier formatting”) reduces violations to about 15%, but does not eliminate them. What is the most effective way to ensure all generated code is consistently formatted?",
o:["Configure a PostToolUse hook with an Edit|Write matcher that automatically runs Prettier on each file Claude modifies.","Split the formatting rules into path-scoped .claude/rules/ files that load when Claude works on matching file types.","Extract the formatting rules into a dedicated skill that Claude loads automatically when generating code, with more detailed examples of correct formatting.","Add a Stop hook with a prompt-based check that evaluates whether generated code follows formatting standards and prompts Claude to fix violations."],
a:0,
e:"Deterministic mechanical outcome, deterministic mechanism: a PostToolUse hook runs the formatter after every edit. Rules, skills, and prompt-based checks are all still instructions the model may not follow perfectly."},

{n:53,q:"You need to add a date validation check ensuring event dates are in the future. This requires adding a conditional statement to one existing function in a single file. What is the most appropriate approach?",
o:["Enter plan mode first to create a detailed implementation strategy before making the change.","Enter plan mode to analyze how the validation might impact other parts of the reservation flow.","Use direct execution to make the change.","Start with extended thinking mode enabled to ensure thorough reasoning about the validation logic."],
a:2,
e:"Plan mode earns its cost when scope is unclear or the blast radius is wide. A one-line conditional in one known function is direct execution."},

{n:54,q:"Your infrastructure-as-code repository includes Terraform modules (/terraform/), Kubernetes manifests (/kubernetes/), and CI/CD pipeline scripts (/pipelines/). Each requires different conventions, but your single root CLAUDE.md has grown to 500+ lines. When developers work on Kubernetes files, Terraform-specific rules load into context unnecessarily, consuming tokens. What is the best approach to reorganize so only relevant guidance loads when editing specific file types?",
o:["Split content into subdirectory CLAUDE.md files (/terraform/CLAUDE.md, /kubernetes/CLAUDE.md), so Claude loads directory-specific guidance.","Keep the root CLAUDE.md and use @path/to/import syntax to modularly include tool-specific guidance files from separate documents.","Restructure the root CLAUDE.md into clearly labeled sections with headers (e.g. “## Terraform Conventions”), improving organization and readability.","Create files in .claude/rules/ with YAML frontmatter path-scoping (e.g., paths: [“terraform/**/*”]), loading rules only when editing matching files."],
a:3,
e:"Path-scoped rules with YAML frontmatter are the mechanism built specifically for conditional loading by file pattern. Section headers do not reduce tokens at all, and @imports load unconditionally.",
d:"Community vote is 100% A (subdirectory CLAUDE.md files), which also works and maps naturally to these directories. Published key is D — the explicit path-scoping mechanism."},

{n:55,q:"You are implementing a complex graph traversal algorithm with specific performance requirements and edge cases to handle (disconnected nodes, cycles, weighted edges). You want to structure your workflow for efficient iterative refinement with Claude. What approach will most effectively enable progressive improvement across multiple iterations?",
