o:["Have Claude extensively research the algorithm and create a detailed implementation plan using extended thinking, then implement the complete solution based on that plan.","Provide Claude with a reference implementation from documentation, then ask it to rewrite the code to match your codebase style and add the required edge case handling, comparing outputs against the reference.","Provide Claude with a detailed natural language specification of the algorithm, including all requirements and edge cases. Review each output manually and provide descriptive feedback on what behavior needs to change.","Write a test suite covering expected behavior, edge cases, and performance requirements before implementation. Ask Claude to write code that passes the tests, then iterate by sharing test failures with each refinement request."],
a:3,
e:"Tests give an objective, automatic feedback signal on every iteration. Manual review and prose feedback are slower and less precise, and a single upfront plan is not iteration."},

{n:56,q:"You have documented API error handling conventions in a CLAUDE.md file at your project root, specifying that endpoint handlers should use a custom ApiError class. After several sessions, you notice Claude Code sometimes follows these conventions and sometimes uses generic try/catch blocks with string messages. The inconsistency appears random across different coding sessions. What is the most efficient first diagnostic step?",
o:["Add more detailed code examples to your CLAUDE.md showing the exact ApiError usage pattern for different endpoint types.","Run /memory to check which memory files are loaded and verify your CLAUDE.md is included.","Search for conflicting instructions in ~/.claude/CLAUDE.md or ~/.claude/rules/ that might override your project conventions.","Create path-specific rules in .claude/rules/handlers.md with YAML frontmatter scoping the error handling instructions to your API handler files."],
a:1,
e:"Diagnose before you fix: /memory tells you whether the file is even being loaded. Rewriting or relocating instructions that were never loaded wastes the effort."},

{n:57,q:"Your team has connected a custom MCP server that provides DevOps workflow templates. The server exposes several MCP prompts (such as deploy_checklist and incident_response) in addition to tools. How do these MCP prompts become accessible within Claude Code?",
o:["They are surfaced as @-mentionable resources alongside files, fetched and attached to your message when referenced.","They are automatically prepended to every conversation as additional system-level context, influencing Claude's behavior throughout the session.","They are added to Claude Code's tool registry alongside the server's tools, invoked automatically by the model when relevant to the task.","They appear as slash commands (e.g., mcp_servername_deploy_checklist) that you can invoke, with arguments passed after the command name."],
a:3,
e:"MCP prompts surface as user-invoked slash commands. MCP resources are the @-mentionable ones; tools go in the tool registry. Keep the three MCP primitives distinct."},

{n:58,q:"You are implementing a new payment processing module that must follow your project's established patterns for database transactions, error handling, and audit logging. You have identified three existing modules that exemplify these patterns: db_utils.py, error_handlers.py, and audit_logger.py. This is a one-off integration task – these patterns are well-documented in your team wiki and do not need additional project-level documentation. What is the most effective approach?",
o:["Add documentation of each pattern to your CLAUDE.md file, establishing them as project conventions that Claude will apply automatically.","Describe the patterns from the three modules in natural language in your prompt, explaining the transaction handling approach, error format, and logging conventions Claude should follow.","Ask Claude to explore your codebase to find and understand the transaction, error handling, and logging patterns before generating the new module.","Use @ references to include the three modules directly in your prompt, giving Claude concrete code examples of the patterns to follow."],
a:3,
e:"You already know the exact files, and it is a one-off, so @-reference them: concrete code beats a description, and CLAUDE.md is for persistent conventions, not one-time tasks. Exploration spends tokens finding what you already know."},

{n:59,q:"Your team is configuring MCP servers in Claude Code. You want to add a shared venue lookup server that all team members should have access to, and you personally want to add an experimental music playlist server that only you are testing. Which configuration approach correctly applies MCP server scopes?",
o:["Add both servers to your local ~/.claude.json","Add venue server to ~/.claude.json and playlist server to .mcp.json","Add venue server to .mcp.json and playlist server to ~/.claude.json","Add both servers to the project-level .mcp.json file"],
a:2,
e:"Project scope (.mcp.json, committed to the repo) is for shared servers; local/user scope (~/.claude.json) is for personal ones. Option B has the two exactly backwards."},

{n:60,q:"Your monorepo contains shared coding standards in /docs/standards/: security-rules.md (for services handling user data), testing-patterns.md (for all packages), and api-conventions.md (for API-facing services). Your 15 packages are organized by feature domain (/packages/auth/, /packages/billing/, /packages/notifications/, etc.) without naming conventions indicating which handle user data or expose APIs. Package maintainers are expected to configure their own local development settings, as they understand their package's domain requirements. Currently, all package CLAUDE.md files duplicate all three standards, applying irrelevant guidance. What is the most effective approach?",
o:["Create .claude/rules/ files for each standard with YAML frontmatter paths listing every package directory where that standard should apply.","Put all standards in the root CLAUDE.md with override instructions like “ignore security-rules.md when working in packages that don't handle user data.”","Create a shared-standards.md that uses @imports to combine all three standards, then have each package's CLAUDE.md import that combined file.","Use @imports in each package's CLAUDE.md to reference only the specific standard files relevant to that package, based on the maintainer's domain knowledge."],
a:3,
e:"Two clues point to @imports per package: the directory names carry no signal a path glob could match, and maintainers are stated to hold the domain knowledge. A hand-maintained path list in one central file fights both facts, and C re-bundles everything."},

{n:61,q:"Your team has three requirements for Claude Code's behavior in your project: (1) Claude must never modify files in the db/migrations/ directory, (2) Claude should prefer your custom logging module over console.log, (3) all TypeScript files must be auto-formatted with Prettier after every edit. All three are currently written as instructions in your project's CLAUDE.md. During a complex refactoring session, a developer discovers that Claude edited a migration file, violating requirement #1. How should you restructure these requirements across Claude Code's configuration mechanisms?",
o:["Add Edit(./db/migrations/**) to permissions.deny in the project settings, keep the logging preference in CLAUDE.md, and add a PostToolUse hook on the Edit tool that runs Prettier on changed TypeScript files.","Move all three requirements into .claude/rules/ as path-scoped rules: one targeting db/migrations/** that forbids editing those files, and others targeting **/*.ts for the logging convention and formatting instruction.","Rewrite all three requirements in CLAUDE.md using stronger directive language and add few-shot examples that demonstrate Claude refusing to edit migration files and running Prettier after edits.","Configure hooks for all three: a PreToolUse hook script that blocks Edit calls targeting db/migrations/, a PreToolUse hook script that adds logging convention context before edits, and a PostToolUse hook that runs Prettier after TypeScript edits."],
a:0,
e:"Match each requirement to the right mechanism: hard prohibition → permissions.deny, stylistic preference → CLAUDE.md, mechanical post-step → PostToolUse hook. B and C leave the hard rule as an instruction; D over-engineers the preference into a hook."},

{n:62,q:"Your team frequently migrates React components to Vue. You have written a step-by-step workflow for Claude Code to follow during each migration, and you want every developer on the team to invoke it by typing /migrate-component. The workflow should stay in sync as the team iterates on it. Where should you place the skill file?",
o:["In ~/.claude/skills/migrate-component/SKILL.md on each developer's machine","In .claude/skills/migrate-component/SKILL.md at the project root, committed to version control","In the project's .claude/settings.json using a skillOverrides entry to register and define the workflow","As a detailed instruction block in the project's root CLAUDE.md file"],
a:1,
e:"Team-wide and staying in sync means project scope committed to version control. Per-machine copies drift immediately, and CLAUDE.md gives no /command invocation."},

{n:63,q:"You have asked Claude to write a data migration script, but the initial output does not correctly handle records with null values in required fields. What is the most effective way to iterate toward a working solution?",
o:["Manually edit the generated code to fix the null handling, then continue working with Claude on other parts.","Add “think harder about edge cases” to your prompt and request a complete rewrite of the migration logic.","Describe the null value problem in detail and ask Claude to regenerate the entire script with improved edge case handling.","Provide a test case with example input containing null values and the expected output, then ask Claude to fix it."],
a:3,
e:"A concrete failing case plus the expected output is the most precise feedback you can give, and it becomes a regression test. Full rewrites risk breaking working code."},

{n:64,q:"You are implementing a caching layer for API responses to speed up the /products endpoint. You have a rough idea – Redis with a 5-minute TTL – but you are new to production caching and are not sure what other considerations a robust implementation requires. What is the most effective way to start your iterative workflow?",
o:["Start with a minimal request: “Add Redis caching to /products with 5-minute TTL.” Add features and fix issues through follow-up prompts as problems surface during testing.","Write a specification with your known requirements and “TBD” markers for uncertain areas, having Claude propose solutions for each TBD as it implements.","Ask Claude to interview you about the caching requirements before implementing, surfacing considerations like invalidation strategies, cache layers, consistency guarantees, and failure modes.","Use plan mode to analyze the current /products endpoint implementation, then provide your caching requirements once Claude explains how the existing code is structured."],
a:2,
e:"When you do not know what you do not know, have Claude elicit the requirements first. The gap here is knowledge of the problem space, not knowledge of the existing code, which is what plan mode would explore."},

{n:65,q:"Your team wants Claude to follow a detailed code review checklist (8 items covering API changes, test coverage, documentation, security, etc.) when reviewing pull requests. The team also uses Claude extensively for other tasks: writing new features, debugging production issues, and generating documentation. Currently, developers paste the checklist at the start of each review session. Which approach best addresses this workflow need?",
o:["Create a /review slash command containing the checklist, invoked when starting reviews.","Create a dedicated review subagent with the checklist embedded in its configuration.","Configure plan mode as the default for code review sessions.","Add the checklist to the project's CLAUDE.md file under a “Code Review” section."],
a:0,
e:"An explicitly invoked, repeated workflow is a slash command. CLAUDE.md would load the checklist into every unrelated session, and a subagent adds isolation this task does not need."},

{n:66,q:"A critical bug is affecting production users. Error logs show exceptions in the OrderProcessing module with a clear stack trace pointing to a specific function. You have not worked with this module before. What is the most effective approach?",
o:["Start with direct execution to gather initial information, then switch to plan mode to design a comprehensive solution before implementing any changes.","Enter plan mode to explore the module's architecture and dependencies before attempting any fixes.","Use plan mode to analyze the error in context of the module's design, enumerate potential root causes, and prioritize fixes systematically.","Use direct execution to examine the stack trace, read the relevant code, and implement a fix once you identify the root cause."],
a:1,
e:"The published key is B: unfamiliar module, production-critical change, so explore the architecture and dependencies in plan mode before touching anything.",
d:"Community vote is 100% D, arguing a clear stack trace makes the problem concrete and localized, which is textbook direct execution. This is one of the weaker published keys — know the plan-mode-vs-direct-execution criteria (scope clarity and blast radius) rather than memorizing this answer."},

{n:67,q:"Your agent has analyzed a complex service module – reading 23 source files, tracing request flows, and identifying error handling patterns. A developer wants to compare two testing strategies before committing to one: end-to-end tests with mocked external services vs. snapshot tests capturing expected outputs. They need to independently develop both approaches to evaluate trade-offs. How should you manage the sessions?",
o:["Start two fresh sessions, having each re-read the relevant source files before beginning.","Resume the analysis session with fork_session enabled, creating a separate branch for each testing strategy.","Export the analysis session's key findings to a file, then create two new sessions that reference this file.","Continue in the original session, developing end-to-end tests first, then snapshot tests sequentially."],
a:1,
e:"fork_session branches from shared accumulated context so each path explores independently without contaminating the other. Fresh sessions throw away 23 files of analysis; one sequential session lets the first approach bias the second."},

{n:68,q:"An engineer asks the agent to understand how the caching layer works before adding a new cache invalidation trigger. After initial Grep searches, the agent has identified that caching logic spans 15 files including decorators, middleware, and service classes (~8,000 lines total). What is the most effective next step for building understanding while managing context constraints?",
o:["Use the Read tool to sequentially load all 15 files, building complete understanding across the full caching implementation.","Use Glob to find files matching common caching patterns (cache.py, caching/), prioritize the largest files by reading them first, then check smaller files for gaps.","Analyze imports and class hierarchies to identify the base cache class, Read that file to understand the interface, then trace specific invalidation implementations.","Use Grep to search for “invalidate” and “expire” patterns across all files, then Read only those specific line ranges with minimal surrounding context."],
a:2,
e:"Follow the structure: find the core abstraction, read the interface, then trace outward to the specific implementations you need. Reading everything blows context, file size is not a relevance signal, and isolated line ranges give no architectural picture."},

{n:69,q:"An engineer sees an unfamiliar error message “SYNC_CONFLICT: entity version mismatch detected” in production logs but does not know which of the 12 services in the codebase generates it. They ask the agent to help locate the source code. What exploration approach will most efficiently find the responsible code?",
o:["Use Glob to find files in directories commonly associated with error handling (such as errors/, exceptions/, or handlers/) across all services, then Read each matching file.","Read the project's README and service configuration files to understand the architecture, then systematically Read source files in each service directory.","Use Grep to search for distinctive text from the error message (like “SYNC_CONFLICT” or “entity version mismatch”), then Read the matching files to understand context.","Use Grep to find all files that import the project's error handling module, then Read those files to locate custom error definitions."],
a:2,
e:"You have a distinctive literal string; grep for it. Glob matches filenames, not contents, and systematic reading is exhaustive search when you already have an exact key."},

{n:70,q:"After integrating a local MCP server providing code analysis tools (analyze_dependencies, find_dead_code, calculate_complexity), you verify the server is healthy and tools appear in the tools/list response. However, the agent consistently uses Grep to search for import statements instead of calling analyze_dependencies – even when users explicitly ask about “code dependencies.” Tool definitions: MCP analyze_dependencies – “Analyzes dependency graph”; built-in Grep – “Search file contents for a pattern using regular expressions. Returns matching lines with line numbers and surrounding context.” What is the most effective approach to improve the agent's selection of MCP tools?",
o:["Add routing instructions to the system prompt specifying that dependency-related questions should use MCP tools rather than Grep.","Remove Grep from available tools when the MCP server is connected to eliminate functional overlap.","Split analyze_dependencies into granular tools (list_imports, resolve_transitive_deps, detect_circular_deps) so each has a focused purpose less likely to overlap with Grep.","Expand MCP tool descriptions to detail capabilities and outputs – e.g., “Builds dependency graph showing direct imports, transitive dependencies, and cycles.”"],
a:3,
e:"The question shows you the cause: a three-word description losing to a detailed one. Fix the description. Removing a useful built-in tool and splitting into three vague tools both work around the real problem."}
,
{n:71,q:"Your agent has spent 25 minutes exploring a game engine's rendering subsystem – reading shader code, buffer management, and frame synchronization logic. An engineer now asks it to understand how the physics engine integrates with rendering for collision debug overlays. You notice recent responses reference “typical rendering patterns” rather than the specific VulkanPipeline and FrameGraph classes it discovered earlier. What is the most effective approach?",
o:["Continue in the current context with more targeted prompts referencing the specific classes by name.","Summarize key rendering findings, then spawn a sub-agent for physics exploration with that summary in its initial context.","Spawn a sub-agent to explore physics independently, then manually synthesize its findings with the rendering knowledge accumulated in the main conversation.","Use /clear to reset context completely, then start fresh with physics exploration using file paths from the project's CLAUDE.md."],
a:1,
e:"Context is degrading, so compact what matters into a summary and hand it to a fresh subagent for the new exploration. /clear discards the rendering knowledge you still need; continuing in a degraded context does not fix the cause."},

{n:72,q:"Your codebase exploration tool stores session IDs to allow engineers to continue investigations across work sessions. An engineer spent an hour yesterday analyzing a legacy authentication module, building context about its architecture and dependencies. They want to continue today. The session ID is valid, but version control shows 3 of the 12 files the agent previously read were modified overnight by a teammate's merge. What approach best balances efficiency and accuracy?",
o:["Start a fresh session to ensure the agent works with current codebase state without stale assumptions","Resume the session and inform the agent which specific files changed for targeted re-analysis","Resume the session and immediately have the agent re-read all 12 previously analyzed files","Resume the session without informing the agent about the changed files"],
a:1,
e:"Keep the hour of accumulated context, correct only the three files that actually changed. Re-reading all 12 wastes context; resuming silently leaves stale assumptions in place."},

{n:73,q:"Your code review assistant needs to analyze pull requests and provide feedback on three aspects: code style compliance, potential security issues, and documentation completeness. Each aspect requires reading files, running analysis tools, and generating a report section. The review process follows the same three-step workflow for every PR. Which task decomposition pattern is most appropriate for this workflow?",
o:["Routing – classify each PR by type (feature, bugfix, refactor) first, then route to different review prompts optimized for that category.","Prompt chaining – break the review into sequential steps where each aspect (style, security, documentation) is analyzed separately, with outputs combined in a final synthesis step.","Single comprehensive prompt – include all instructions in one prompt and let the model handle all three aspects simultaneously.","Orchestrator-workers – have a central LLM analyze each PR to dynamically determine which checks are needed, then delegate to specialized worker LLMs for each identified subtask."],
a:1,
e:"The workflow is fixed and identical for every PR, which is exactly when prompt chaining fits. Orchestrator-workers is for dynamically determined subtasks; routing is for divergent inputs; a single prompt dilutes attention across three concerns."},

{n:74,q:"After adding an MCP server with specialized code refactoring tools (extract_function, rename_variable, inline_function), you notice the agent still uses basic text manipulation via Write and Bash sed commands for refactoring tasks. The MCP server is connected and healthy. Examining the configuration, you find each MCP tool has a minimal description like “extract_function: Extracts a function from code.” What is the most effective way to improve adoption of the MCP refactoring tools?",
o:["Implement a request classifier that detects refactoring intent and automatically routes those requests to the MCP server before the agent processes them.","Remove the Write tool from the agent's configuration for refactoring sessions so it must use the MCP tools for code modifications.","Accept this as expected behavior since simpler tools like sed are more predictable than specialized refactoring tools.","Enhance the MCP tool descriptions to explain when each tool is preferable to text manipulation and clarify expected inputs and outputs."],
a:3,
e:"Same pattern as Q70: thin descriptions lose to well-described built-ins. Write descriptions that state when the tool is the right choice and what it expects."},

{n:75,q:"A developer asks the agent to investigate why a specific API endpoint intermittently returns 500 errors. The codebase has 200+ files and the developer does not know which components are involved. The agent must trace the error through routing, middleware, business logic, and database layers. What task decomposition approach would be most effective?",
o:["Have the agent dynamically generate investigation subtasks based on what it discovers at each step, adapting its exploration plan as new information about the error path emerges.","Have the agent first create a comprehensive plan mapping all code paths through the endpoint before beginning any file exploration or code reading.","Run parallel worker agents that simultaneously investigate all four layers, then synthesize their findings to identify where the error originates.","Define a fixed sequence of investigation steps upfront – grep for error patterns, then read error handlers, then check database queries, then examine middleware – executing each step regardless of intermediate findings."],
a:0,
e:"Debugging is inherently path-dependent: each finding narrows the next step. Fixed sequences and upfront comprehensive plans both assume knowledge you do not have yet."},

{n:76,q:"Your agent needs to insert a new helper function into the middle of a 150-line utility module, between two existing functions. The Edit tool fails because its old_string parameter cannot find unique text to match – the file has repetitive docstrings, variable names, and structural patterns. What is the most reliable way to complete this insertion?",
o:["Use Edit with an extremely long old_string capturing 30+ lines of context to guarantee uniqueness","Use Bash to append the function definition to the end of the file using heredoc syntax","Use Edit's replace_all parameter to target a common pattern and embed the new function in the replacement text","Use Read to load the file, add the function at the appropriate location, then Write the updated file"],
a:3,
e:"At 150 lines, Read-modify-Write is safe and precise. Appending puts the function in the wrong place, and replace_all would duplicate the insertion at every match."},

{n:77,q:"An engineer used the agent yesterday to analyze a legacy authentication module, identifying two distinct refactoring approaches: extracting a microservice versus refactoring in-place. Today, they want to explore both approaches in depth – having the agent propose specific code changes for each – before deciding which to implement. What is the most effective way to structure this exploration?",
o:["Start two fresh sessions, manually providing a summary of yesterday's analysis findings to establish context.","Resume yesterday's session and explore both approaches sequentially within the same conversation thread.","Resume yesterday's session to explore the first approach, then start a new session for the second, manually recreating the original context.","Use fork_session to create two branches from yesterday's analysis, exploring one approach in each fork."],
a:3,
e:"Two independent explorations from a shared starting point is the fork_session use case. Sequential exploration in one thread lets the first approach contaminate the second."},

{n:78,q:"An engineer asks your agent to identify untested code paths in a legacy payment processing module spanning 45 files. After reading the first 8 source files, the agent's responses are becoming noticeably less accurate – it is forgetting previously discussed code patterns and has not yet located all test files or traced critical payment flows. What is the most effective approach to complete this investigation?",
o:["Switch to using Grep to search for specific function names instead of reading full files, reducing the content loaded into context for remaining exploration.","Spawn subagents to investigate specific questions (e.g., “find all test files for payment processing,” “trace refund flow dependencies”) while the main agent coordinates findings and preserves high-level understanding.","Document all current findings in a summary report, clear context completely, then use that report as the sole reference for continuing the investigation.","Clear context with /clear, then selectively re-read only the most critical files discovered so far, writing key findings to a scratchpad file that persists between context resets."],
a:1,
e:"Delegate the context-heavy subquestions to subagents whose contexts are disposable, and keep the main agent's context for coordination and synthesis. Grep alone cannot answer “which paths are untested,” and clearing context loses the understanding built so far."},

{n:79,q:"During testing, you observe that in extended exploration sessions (30+ minutes), the agent starts giving inconsistent answers about code structure it discussed earlier. Engineers report having to repeat context about modules they have already explored. What is the most effective approach to address this?",
o:["Implement automatic context clearing every 15 minutes to ensure the agent starts with fresh, uncontaminated context.","Switch to a higher-capacity model tier to provide more context window space for accumulated exploration data.","Create summaries of all source files before exploration begins, loading only these compressed representations into context.","Have the agent maintain a scratchpad file that records key findings, referencing it for subsequent questions."],
a:3,
e:"Externalize memory to a file that survives context pressure and can be re-read on demand. Timed clearing destroys findings, and pre-summarizing everything wastes effort on files that never get touched."},

{n:80,q:"An engineer submits two requests: Request A – “Rename the getUserData function to fetchUserProfile everywhere it's used.” Request B – “Improve error handling throughout the data processing module – add try/catch blocks, meaningful error messages, and ensure failures do not silently corrupt data.” For which request does specifying an explicit multi-phase workflow (such as analyze → propose → implement with review) most improve outcome quality?",
o:["Neither request benefits significantly","Request A, the function rename task","Both requests benefit equally","Request B, the error handling task"],
a:3,
e:"A is mechanical with one correct outcome. B involves judgment about failure semantics across many call sites, so an analyze-propose-review cycle catches wrong assumptions before they are written into code."},

{n:81,q:"An engineer asks the agent to find all files in the monorepo that import the @company/auth package to understand how authentication is used across services. Which built-in tool is most appropriate for this task?",
o:["Read, starting with package.json files to trace dependency declarations","Glob, to find files with “auth” in their filename or path","Grep, to search for the import statement pattern across file contents","Bash, to execute find . -type d -name “*auth*” and explore matching directories"],
a:2,
e:"Searching file contents for a pattern is Grep. Glob and find match paths, and package.json shows declared dependencies, not actual import sites."},

{n:82,q:"When researching “renewable energy adoption,” the web search agent returns recent statistics (2024: 35% adoption) while the document analysis agent extracts data from internal reports (2021: 18% adoption). The synthesis agent incorrectly flags these as contradictory sources rather than recognizing the data shows growth over time. What change would best enable the synthesis agent to correctly interpret such temporal differences?",
o:["Instruct the synthesis agent to always treat the most recent data as authoritative and place older findings in a separate historical appendix.","Add a conflict resolution agent that automatically discards older data when newer data exists for the same metric.","Require subagents to include publication or data collection dates in their structured outputs.","Configure the web search agent to only return results from the past 6 months."],
a:2,
e:"The synthesis agent cannot see the time dimension because it is not in the data. Add dates to the structured output and the apparent contradiction resolves into a trend. Discarding or restricting older data destroys the trend entirely."},

{n:83,q:"In production, you observe that simple fact-checking queries (e.g., “What year was the Paris Climate Agreement signed?”) traverse all four subagents sequentially, consuming 40+ seconds and significant tokens per query. Complex comparative research benefits from the full pipeline. Your query distribution is diverse and evolving as users discover new applications. What is the most effective approach to optimize for varying query complexity?",
o:["Create a fast-path for factual questions that bypasses subagents entirely, routing all other queries through the complete pipeline to ensure research thoroughness.","Implement pattern-based routing that categorizes queries by structure (single-fact vs. comparative vs. analytical) and maps each category to a predefined subagent combination.","Train a query complexity classifier on labeled historical data to predict optimal subagent combinations, retraining periodically as query patterns evolve.","Have the coordinator analyze each query and dynamically decide which subagents to invoke based on its assessment of query requirements."],
a:3,
e:"“Diverse and evolving” rules out fixed categories and trained classifiers, both of which need re-work as patterns shift. Dynamic coordinator judgment adapts without maintenance."},

{n:84,q:"When analyzing complex legal cases that cite multiple precedents, the document analysis subagent processes each sequentially. A landmark case citing 12 precedents takes over 3 minutes to analyze completely. What is the most effective way to reduce this latency while preserving the coordinator's ability to monitor and debug the system?",
o:["Create a recursive agent hierarchy where analysis agents subdivide work among child agents until reaching single-precedent granularity","Have the coordinator spawn parallel document analysis subagents, each handling a subset of precedents, then aggregate results before synthesis","Enable the document analysis subagent to spawn its own specialized subagents dynamically when it encounters cases with many citations","Implement a message queue where precedent analysis tasks are processed asynchronously by a pool of worker agents"],
a:1,
e:"Coordinator-level parallel fan-out keeps the topology flat and observable. Recursive hierarchies and self-spawning subagents both hide execution from the coordinator, which the question explicitly requires preserving."},

{n:85,q:"A user is expanding the research system by adding a financial API agent that returns structured JSON with revenue, margins, and growth rates; a news monitoring agent that returns prose summaries of recent developments; and a patent analysis agent that returns structured lists of technology areas. The synthesis agent combines these into executive briefings. Currently, it converts everything to bullet points, causing financial comparisons to lose tabular clarity and news summaries to lose narrative flow. What change would most improve briefing quality?",
o:["Update the synthesis agent to render each content type appropriately – financial data as tables, news as prose","Standardize all subagent outputs to prose summaries with inline citations","Standardize all subagent outputs to JSON with fields for claim, evidence, source, and confidence","Add a format conversion layer between subagents and synthesis that transforms all outputs to a common intermediate representation"],
a:0,
e:"The problem is at the rendering step, not the inputs: fix presentation so each data type keeps its natural form. Any option that forces one uniform format recreates the same information loss."},

{n:86,q:"You have asked Claude Code to build a PDF report generation feature. The initial implementation queries the database correctly, but the output has formatting issues: table columns are too narrow causing content truncation, dates display without proper formatting, and page break handling is incorrect. You have noticed these issues interact – changing column widths affects how dates render, and page breaks depend on content height. What is the most effective approach for iterating toward a working solution?",
o:["Show Claude an example of a correctly formatted report and ask it to match that output, rather than listing the specific technical issues.","Address the column width issue first with specific measurements, verify it works, then fix date formatting within the corrected columns, then adjust page breaks – testing after each change.","Provide all three issues in a single detailed message with exact specifications for each, allowing Claude to address them together in one update.","Start fresh with a detailed prompt specifying all formatting requirements upfront."],
a:1,
e:"Because the issues interact, fixing them together makes it impossible to tell which change caused which effect. Sequential fixes with verification isolate cause and effect."},

{n:87,q:"You are tasked with adding real-time updates to the application. This could be implemented using WebSockets, Server-Sent Events, or polling, each with different complexity, browser support, and infrastructure requirements. What is the most effective way to begin this task?",
o:["Use direct execution with a prompt asking Claude to analyze all approaches and implement the one it determines is best.","Use direct execution to implement polling first, then evaluate whether to upgrade to WebSockets later.","Enter plan mode to explore the architecture, evaluate trade-offs, and present options for team approval before implementing.","Start direct execution with WebSockets, then refactor if infrastructure issues arise."],
a:2,
e:"An unmade architectural decision with infrastructure implications is the canonical plan mode case: evaluate trade-offs and get human sign-off before writing code."},

{n:88,q:"A security audit requires updating your authentication library from v2 to v3. The migration guide documents breaking changes: authenticate() now returns a Promise instead of accepting a callback, the User type has restructured fields, and three deprecated methods were removed. Grep shows the library is imported in 45 files across several modules. What is the most effective approach?",
o:["Update the dependency version, run the test suite, and use Claude Code to fix each failure as it appears.","Paste the migration guide's breaking changes into your prompt and use direct execution to update all usages across the 45 files.","Create a custom slash command encapsulating the migration transformations, then execute it against each file without prior codebase exploration.","Enter plan mode to explore library usage across modules, map affected code paths, then create a migration strategy before implementing."],
a:3,
e:"45 files, three interacting breaking changes, security-critical: map the blast radius in plan mode first. Test-driven whack-a-mole misses untested paths, and blind bulk edits risk widespread breakage."},

{n:89,q:"An engineer asks your agent to add comprehensive tests to a legacy codebase with 200 files and minimal existing test coverage. The engineer has not specified which modules to prioritize. How should the agent decompose this open-ended task?",
o:["Start writing tests for the first module alphabetically, using test failures and imports to discover related files organically.","Use Glob and Grep to map codebase structure, identify heavily-coupled modules, create a prioritized plan for high-impact areas, and revise as dependencies are discovered.","Systematically read all 200 files to create a complete function inventory before writing any tests, ensuring the testing plan accounts for every function before beginning.","Create a fixed testing schedule upfront based on directory structure, allocating equal effort to each top-level directory regardless of code complexity or business importance."],
a:1,
e:"Map cheaply first, prioritize by impact, then revise as you learn. Reading 200 files exhausts context before any test exists, and alphabetical or equal-effort schemes ignore risk."},

{n:90,q:"You have configured your Claude agent with three MCP servers: one for git operations, one for Jira ticket management, and one for documentation search. When a user asks the agent to “create a branch for JIRA-123 and add documentation links to the ticket,” how does the agent access tools across these servers?",
o:["Tools from all configured MCP servers are discovered at connection time and available simultaneously to the agent.","The agent automatically selects the most relevant server based on the request and loads only that server's tools.","The agent queries each server sequentially to determine which handles each tool, routing calls based on tool name prefixes.","You must specify which MCP server to use for each turn, and the agent can only access one server's tools at a time."],
a:0,
e:"All connected servers' tools are discovered at connect time and presented as one combined tool set, which is why cross-system tasks work in a single turn — and also why tool count discipline matters."},

{n:91,q:"An engineer's exploration subagent spent 30 minutes analyzing a legacy payment system, reading 47 files and documenting data flows. The session was interrupted when the engineer's connection dropped. While away, a teammate merged a PR that renamed two utility functions. The engineer wants to continue the same exploration. What is the most effective approach?",
o:["Resume the subagent from its previous transcript without mentioning the changes – the architecture understanding remains valid.","Launch a fresh subagent and include the prior transcript in the initial prompt for context.","Launch a fresh subagent with a summary of prior findings.","Resume the subagent from its previous transcript and inform it about the renamed functions."],
a:3,
e:"Same principle as Q72: resume to keep 30 minutes of accumulated context, and correct the specific stale facts. Two renamed functions do not invalidate an architectural understanding of 47 files.",
d:"Community vote is C (fresh subagent with a summary). The published key is D — resume plus a targeted correction is cheaper and loses less detail."},

{n:92,q:"An engineer used Claude Code yesterday to investigate authentication flows in a legacy monolith, building up significant context over a 2-hour session. Today she wants to continue that specific investigation. She has worked on three other codebases since then and knows the session was named “auth-deep-dive”. How should she resume?",
o:["Use --resume auth-deep-dive to load that specific session by name","Use --continue to pick up where the most recent conversation left off","Start fresh and re-read the same files","Use --session-id with the UUID from yesterday's session transcript file"],
a:0,
e:"--resume targets a specific named session; --continue would load the most recent conversation, which is one of the three other codebases she has worked on since."},

{n:93,q:"An engineer asks the agent to find all callers of a function before removing it. The function is defined in a core library but is also exposed through wrapper modules that rename the function for domain-specific use (e.g., calculateTax in the library becomes computeOrderTax in the orders module). What exploration strategy will most reliably identify all callers?",
o:["Search for the function name in project documentation to understand intended usage patterns and navigate to documented integration points.","Use Grep to find all files that import from the library or wrapper modules, then read each file to check whether it uses the function.","Use Grep to search for the function's original name across the codebase.","Read the library and wrapper modules to identify all exposed names for the function, then Grep for each name across the codebase."],
a:3,
e:"Aliasing means one grep on the original name misses every renamed call site. First enumerate all the names the function is exposed under, then search for each. Documentation is not a reliable completeness check."},

{n:94,q:"Your extraction pipeline processes restaurant menus and must output structured JSON with fields for item names, descriptions, prices, and dietary tags. Some menus use inconsistent formatting – prices as “$12” vs “12.00”, dietary info as icons vs text. What is the most reliable approach?",
o:["Define a strict output schema and include format normalization rules in your prompt.","Extract data as-is and normalize formats in post-processing code after Claude returns.","Use separate extraction calls for each field to ensure consistent handling of each type.","Request multiple extraction attempts per document and select the most common format."],
a:0,
e:"Normalize at extraction time by combining a strict schema with explicit normalization rules — the model sees the source context needed to interpret icons and currency variants. Post-processing works blind, and per-field calls multiply cost."},

{n:95,q:"Your system has been operating with 100% human review for 3 months. Analysis shows that extractions with model confidence ≥90% have 97% accuracy overall. To reduce reviewer workload, you plan to automate high-confidence extractions. Before deploying, what validation step is most critical?",
o:["Verify that 97% accuracy meets requirements for all downstream systems that consume the extracted data.","Analyze accuracy by document type and field to verify high-confidence extractions perform consistently across all segments, not just in aggregate.","Compare accuracy at different confidence thresholds (85%, 90%, 96%) to find the optimal cutoff that maximizes automation while minimizing errors.","Run a two-week pilot routing 25% of high-confidence extractions directly to downstream systems and monitor error reports."],
a:1,
e:"An aggregate can hide a segment where high-confidence extractions are badly wrong. Segment the metric by document type and field before trusting it. Threshold tuning and pilots both assume the aggregate is representative."},

{n:96,q:"Your schema includes a skills: string[] field. Production monitoring reveals three consistency issues: (1) compound phrases like “Python and SQL” are sometimes kept as one entry, sometimes split; (2) implied but unstated skills occasionally appear in extractions; (3) similar documents produce wildly different array lengths (5-10 vs 40+ entries). Your prompt currently says “Extract all skills mentioned.” What is the most effective improvement?",
o:["Add few-shot examples demonstrating compound phrase handling, explicit mention criteria, and appropriate entry granularity.","Add post-extraction normalization that maps skills to a canonical taxonomy and deduplicates similar entries.","Enrich the schema to {skill: string, confidence: float, source_quote: string}[] to capture extraction metadata.","Add constraints: “Extract 10-20 skills maximum, one skill per entry, only explicitly named skills.”"],
a:0,
e:"All three failures are judgment calls about granularity and inclusion, which examples demonstrate far better than prose rules. D's hard numeric cap would truncate documents that legitimately contain more skills."},

{n:97,q:"Your system extracts event metadata (date, location, organizer, attendee_count) from news articles using a JSON schema with all nullable fields. During evaluation, you observe the model frequently generates plausible but incorrect values for fields not mentioned in the article – for example, outputting “500” for attendee_count when the source contains no attendance information. What is the most effective way to reduce these false extractions?",
o:["Add prompt instructions to return null for any field where information is not directly stated in the source.","Make all schema fields required (non-nullable) with strict validation rules to ensure the model only outputs verifiable data.","Add a post-processing step using a second LLM call to verify each extracted value exists in the source document.","Upgrade to a more capable model tier with improved instruction-following to reduce hallucination tendencies."],
a:0,
e:"The fields are already nullable; the model just needs explicit permission and instruction to use null for absent information. Making fields required would force fabrication, which is the opposite fix."},

{n:98,q:"Your system has been running for 3 weeks and human reviewers have corrected 847 extractions. Analysis reveals a recurring pattern: when recipes use informal measurements like “a handful” or “a splash,” the model either invents specific amounts or leaves fields empty – accounting for 23% of all corrections. How should you use this feedback to improve extraction accuracy?",
o:["Update your JSON schema to add a “measurement_type” enum field (precise/informal).","Implement a post-processing layer that uses pattern matching to detect informal measurement phrases in source text and automatically populate values when the extraction is empty.","Add few-shot examples to your prompt demonstrating correct handling of informal measurements – extracting them verbatim rather than converting or omitting them.","Fine-tune the model on the 847 corrected extractions."],
a:2,
e:"A well-characterized, recurring edge case is what few-shot examples are for: show the desired handling directly. Fine-tuning is heavy for one pattern, and pattern matching cannot cover the open set of informal phrasings."},

{n:99,q:"Your pipeline uses a tool called extract_metadata with a JSON schema for paper details. You have also defined lookup_citations and verify_doi tools for enrichment. During testing, you notice that when users include requests like “extract the metadata and tell me how cited it is,” Claude sometimes calls lookup_citations first, which fails because it needs the DOI that extract_metadata would provide. What is the most effective way to ensure structured metadata extraction happens first?",
o:["Set tool_choice to {“type”: “tool”, “name”: “extract_metadata”} for every API call in the pipeline, ensuring Claude always extracts metadata before any enrichment can occur.","Set tool_choice to {“type”: “tool”, “name”: “extract_metadata”} and process the enrichment requests in subsequent turns after receiving the extracted metadata.","Set tool_choice to “auto” and reorder the tool definitions so extract_metadata appears first in the tools array, since Claude prioritizes earlier-listed tools.","Set tool_choice to “any” so Claude must use a tool, combined with system prompt instructions prioritizing extract_metadata."],
a:1,
e:"Force the first tool on the first turn, then let enrichment proceed in later turns. A forces it on every call, so enrichment could never run. Tool order in the array does not establish priority, and “any” only forces some tool."},

{n:100,q:"Testing reveals that when source documents are missing certain specifications, the model fabricates plausible-sounding values to satisfy your schema's required fields. For example, a document mentioning only dimensions receives a fabricated “weight: 2.3 kg” in the extraction output. What schema design change most effectively addresses this hallucination behavior?",
o:["Change fields that may not exist in source documents from required to optional, allowing the model to omit them","Add explicit instructions to the prompt stating “only extract information explicitly stated in the document; use placeholder text for missing values”","Add a “confidence” field alongside each specification where the model self-reports its certainty, then filter out low-confidence extractions","Implement semantic validation that verifies each extracted value appears in or can be inferred from the source document text"],
a:0,
e:"The question asks for a schema design change, and the schema itself is causing the fabrication by requiring fields the source may not contain. Making them optional removes the pressure. Placeholder text still puts junk in the field."},

{n:101,q:"Your extraction pipeline validates outputs against JSON schemas, but you need to implement human review given limited reviewer capacity (they can handle approximately 5% of total extraction volume). What is the most effective basis for selecting which extractions to route for human review?",
o:["Randomly sample 5% of extractions for review.","Route extractions where the model indicates low confidence or where source documents contain ambiguous or contradictory information.","Route extractions for review only when downstream systems report data quality issues or processing failures.","Route extractions containing specific high-priority entity types (e.g., financial figures, dates) for human review, regardless of extraction confidence."],
a:1,
e:"With scarce capacity, target the cases most likely to be wrong: low confidence and ambiguous sources. Random sampling measures error rate but catches few errors; waiting for downstream complaints means the bad data has already shipped."},

{n:102,q:"The system needs to extract candidate information (name, contact details, skills, work experience, education) from uploaded resumes. The extracted data must strictly conform to a predefined JSON schema, as missing required fields or incorrect data types will cause downstream validation failures. What is the most reliable approach to ensure Claude's output consistently matches the schema?",
o:["Make two separate API calls – first extracting information as text, then asking Claude to format that text as JSON.","Define a tool with an input schema matching your required JSON structure and extract the data from Claude's tool_use response.","Parse Claude's text response with regex patterns to extract JSON objects, using retry logic for malformed responses.","Include detailed JSON formatting instructions and a template example in the system prompt, asking Claude to output only valid JSON."],
a:1,
e:"Tool use with an input schema is the mechanism for guaranteed structured output — the API enforces the shape. Prompting for JSON and parsing text are both best-effort."},

{n:103,q:"The system routes documents with extraction confidence below 85% to human review. A quarterly audit reveals that 12% of high-confidence extractions (≥85%) also contain errors – cases where the model finds plausible-but-incorrect values. Error sources vary: comparison tables showing competitor specs, appendices referencing different product variants, and ambiguous phrasing the model misinterprets. You need a sustainable strategy to catch these high-confidence errors and measure whether improvements reduce the error rate over time. What approach is most effective?",
o:["Add a verification pass that re-extracts from each high-confidence document, flagging cases where the two extraction attempts produce different results","Lower the confidence threshold from 85% to 70%, routing a larger volume of extractions to human review.","Implement stratified random sampling reviewing a fixed percentage of high-confidence extractions weekly, enabling error rate measurement and novel pattern detection.","Implement heuristic rules that flag documents containing comparison tables or appendices for review regardless of confidence score."],
a:2,
e:"“Sustainable” and “measure whether improvements reduce the error rate” both point to ongoing stratified sampling — it produces an unbiased, trackable metric and surfaces error patterns you have not thought of. Heuristics only catch the failure modes you already know."},

{n:104,q:"Your extraction pipeline processes invoices and extracts line items, subtotals, tax amounts, and grand totals. During evaluation, you discover that in 18% of extractions, the sum of extracted line item amounts does not match the extracted grand total – sometimes due to OCR errors in the source document, sometimes due to extraction mistakes by the model. Downstream accounting systems reject records with mismatched totals. What is the most effective approach to improve extraction reliability?",
o:["Add few-shot examples demonstrating invoices where extracted line items sum correctly to the stated total, encouraging the model to produce mathematically consistent extractions.","Add a “calculated_total” field where the model sums extracted line items alongside a “stated_total” field. Flag records for human review when values differ.","Extract line items and totals independently, then use a separate validation model to reconcile discrepancies by determining which extracted values are most likely correct.","Implement post-processing that automatically adjusts line item amounts proportionally when their sum does not match the stated total."],
a:1,
e:"Capture both numbers, compare them deterministically, and escalate real discrepancies. Some mismatches originate in the source document, so any option that silently reconciles or adjusts values corrupts the data."},

{n:105,q:"Your extraction pipeline processes contracts that frequently include amendments. When a contract contains both original terms and later amendments (e.g., original clause specifies “30-day payment terms” while Amendment 1 changes this to “45 days”), the model inconsistently extracts one value or the other with no indication of which applies. What is the most effective approach to improve extraction accuracy for documents with amendments?",
o:["Preprocess documents with a classifier that identifies and removes superseded sections before the main extraction step.","Implement post-extraction validation using pattern matching to detect amendments and flag those extractions for manual review","Redesign the schema so amended fields capture multiple values, each with source location and effective date.","Add prompt instructions to always extract the most recent amendment value and ignore superseded original terms."],
a:2,
e:"The data genuinely has multiple values over time, so the schema must model that: value plus source location plus effective date. Collapsing to “most recent” discards the audit trail contracts require, and deleting superseded sections destroys source evidence."}
,
{n:106,q:"Monitoring shows 12% of extractions fail Pydantic validation with specific errors like “expected float for quantity, got ‘2 to 3’”. Retrying these requests without modification produces identical failures. What is the most effective approach to recover from these validation failures?",
o:["Send a follow-up request including the validation error, asking the model to correct its output","Implement a secondary pipeline using a larger model tier to reprocess documents that fail validation","Pre-process source documents to standardize problematic formats before sending them for extraction","Set temperature to 0 to eliminate output variability and ensure consistent formatting"],
a:0,
e:"Identical retries fail identically because nothing new was added. Feed the specific validation error back so the model can correct that exact field. Temperature 0 makes the same failure more consistent, not less likely."},

{n:107,q:"Your system must extract event details from calendar invitations and output JSON that strictly conforms to a schema with fields for title, date, time, location, and attendees. Downstream systems reject any malformed or non-conformant JSON. What approach provides the most reliable schema compliance?",
o:["Include detailed JSON formatting instructions and the target schema in your prompt, then parse Claude's text response as JSON.","Define a tool with your target schema as input parameters and have Claude call it with the extracted data.","Append instructions like “Output only valid JSON matching the schema exactly” and implement retry logic to re-prompt when JSON parsing fails.","Pre-fill Claude's response with an opening brace to force JSON output, then complete and parse the response."],
a:1,
e:"Tool use with an input schema is the enforced path to conformant structured output. Prompt instructions, retries, and prefill are all heuristics that reduce but do not eliminate malformed output."},

{n:108,q:"Your extraction uses tool use with a JSON schema where property_type is defined as an enum: ['house', 'apartment', 'condo', 'townhouse']. After deployment, 8% of extractions fail schema validation. Investigation reveals listings mention many uncommon property types – “studio”, “loft”, “duplex”, “mobile home”, “tiny house”, “converted warehouse” – and new types continue appearing regularly. What is the most effective long-term solution?",
o:["Continuously expand the enum to include newly observed property types and add monitoring for additional edge cases.","Change property_type from an enum to a free-form string and implement a normalization step in post-processing.","Add an “other” value to your enum with a separate property_type_detail string field for specifics when “other” is selected.","Add few-shot examples to your prompt demonstrating how unexpected property types map to the closest existing enum value."],
a:2,
e:"An escape hatch keeps the enum's validation value for the common cases while accommodating an open-ended tail without losing detail. Chasing the enum forever is unsustainable, a free string abandons validation, and mapping to the “closest” value silently falsifies data."},

{n:109,q:"Your extraction system uses tool_use with a JSON schema containing 12 fields and detailed descriptions, totaling approximately 2,500 tokens for the complete tool definition. Processing documents under 150K tokens yields 98% accuracy. For documents between 175-190K tokens, accuracy drops to 71%, with information from the final third consistently missed. The model's context window is 200K tokens. What is the most likely cause?",
o:["The model distributes attention proportionally across input length, causing fields mentioned only once near the document's end to receive insufficient processing focus.","Very long documents exceed the model's effective attention span regardless of context limits, causing accuracy degradation for content farther from the prompt instructions.","Schemas exceeding 8-10 fields increase decision complexity during parameter generation, reducing extraction accuracy independent of document length.","Tool definitions consume input context tokens. Combined with system prompts and document content, the total approaches the context limit, degrading end-of-document processing."],
a:3,
e:"Tool definitions count against the input context. 190K of document plus 2,500 tokens of tool schema plus the system prompt crowds the 200K window, and the tail of the document is what gets squeezed. C is contradicted by the fact that accuracy is 98% on shorter documents with the same schema."},

{n:110,q:"After your daily batch of 10,000 documents completes, 300 documents (3%) failed with “context_length_exceeded” errors. The results file identifies each failure by custom_id. What is the most cost-effective approach to process these failures?",
o:["Resubmit only the 300 failed documents after chunking them into smaller pieces, then combine the partial extractions","Reprocess the entire batch with prompt caching enabled to reduce the cost of retrying requests with identical system prompts","Increase the max_tokens parameter for the 300 failed documents and resubmit them in a new batch","Resubmit the entire 10,000 document batch using a model tier with a larger context window"],
a:0,
e:"Only the 300 oversized documents need work, and the fix for exceeding context is chunking. max_tokens caps output, not input, so C does not address the error at all, and reprocessing all 10,000 pays 33x for the same result."},

{n:111,q:"Your extraction system processes two document types: standard monthly reports (archived after processing) and urgent exception reports (must trigger business alerts within 30 minutes of receipt). Both use the same JSON schema. You want to minimize API costs while meeting latency requirements. How should you architect the processing pipeline?",
o:["Submit all documents to the Batch API with custom_ids for tracking. When results arrive, immediately process urgent documents and trigger delayed alerts for exceptions.","Queue all documents and submit hourly batches, flagging urgent documents for expedited handling when batch results return.","Submit all documents to the real-time Messages API to ensure consistent processing latency across document types.","Route standard reports to the Batch API for 50% cost savings, and route urgent exception reports to the real-time Messages API."],
a:3,
e:"Route by latency requirement: batch for the archive-bound work, real-time for the 30-minute SLA. Batch offers no delivery guarantee inside 30 minutes, and sending everything real-time forfeits the discount unnecessarily."},

{n:112,q:"Your extraction system parses e-commerce product descriptions to extract specifications like dimensions, weight, and materials into JSON. Despite having a well-defined schema, the model inconsistently extracts the “materials” field – sometimes returning “cotton blend”, other times “Cotton/Polyester mix”, and occasionally omitting the field when material information is clearly present in the source. What is the most effective way to improve extraction consistency?",
o:["Add few-shot examples showing 2-3 complete input-output pairs with standardized material description formats","Switch to a more capable model tier since inconsistent extraction indicates insufficient model capability","Make the “materials” field required instead of optional in the schema to force the model to always extract a value","Set temperature to 0 to eliminate randomness and ensure deterministic outputs"],
a:0,
e:"Formatting consistency is a demonstration problem: show the desired format in examples. Making the field required causes fabrication when material genuinely is absent, and temperature 0 does not teach a format."},

{n:113,q:"After implementing tool use with strict schema definitions, JSON syntax errors are eliminated, but 5% of extractions still have valid JSON with empty arrays or null values for required fields like citations and methodology. Spot-checking reveals that source documents contain this information, but in varied formats – inline citations vs. bibliographies, methodology sections vs. details embedded in introductions. What is the most effective way to address these failures?",
o:["Build a regex-based post-processing layer that scans source documents for citation patterns and methodology keywords, populating empty fields when the model fails to extract.","Implement retry logic that re-sends requests when validation detects empty required fields.","Add few-shot examples demonstrating extractions from documents with varied structures – showing how to identify citations in different formats and locate methodology details across section types.","Modify your schema to make citations and methodology optional, and flag incomplete records for manual review rather than failing validation."],
a:2,
e:"The model is not recognizing the information in unfamiliar layouts, so demonstrate extraction across those varied structures. Blind retries repeat the same miss, regex cannot generalize across citation formats, and D just accepts the failure."},

{n:114,q:"After deployment, you find that 12% of extractions contain semantic errors that pass JSON schema validation (e.g., a duration like “30 minutes” incorrectly placed in an ingredient quantity field). Human reviewers have capacity to check only 20% of extractions. Which approach most effectively allocates reviewer attention?",
o:["Prioritize review of all extractions where required fields are empty or explicitly marked as not found.","Have the model output field-level confidence scores, then calibrate review thresholds using a labeled validation set.","Review all extractions from documents with formatting anomalies such as unusual layouts or mixed content types.","Randomly sample 20% of extractions for review, using corrections to track accuracy and identify error patterns."],
a:1,
e:"Field-level confidence plus thresholds calibrated against labeled data targets the 20% capacity at the most error-prone outputs. Empty fields are a different failure mode, formatting anomalies are a proxy, and random sampling measures rather than catches."},

{n:115,q:"Production monitoring shows the research phase takes longer than expected. Analysis reveals the coordinator invokes the web search subagent, waits for its response, then invokes the document analysis subagent and waits again. These tasks are independent – neither requires the other's output. How should you modify the system to run these subagents concurrently?",
o:["Create an async orchestration layer outside the agent that spawns parallel threads, each running a separate coordinator-subagent pair, then aggregates results.","Add detailed instructions to the coordinator's system prompt explaining the performance benefits of parallel execution and requesting it invoke both subagents at the same time.","Switch both subagents to use a Haiku-tier model instead of Sonnet to reduce their individual execution time.","Structure the coordinator to emit both Task tool calls (for web search and document analysis) in a single response message rather than across separate conversation turns."],
a:3,
e:"Parallelism comes from multiple tool calls in one assistant message — they execute concurrently. Explaining the benefits in the prompt does not change the message structure, and a faster model still runs sequentially."},

{n:116,q:"Your CI pipeline performs security-focused code reviews on approximately 50 PRs daily, currently costing $150/day using the synchronous API. Reviews are non-blocking – developers merge after tests pass and address findings in follow-up commits. You are evaluating the Message Batches API for its 50% cost reduction. What factor most determines whether batch processing is appropriate for this use case?",
o:["Whether review feedback arriving up to 24 hours after PR creation remains actionable.","Whether your result processing can handle reviews arriving in a different order than submitted.","Whether you can structure each review as a single request without multi-turn refinement.","Whether reducing per-review latency from 30-60 seconds to near-instant matters for your workflow."],
a:0,
e:"The Batch API's defining trade-off is a processing window of up to 24 hours. Since reviews are non-blocking, the only real question is whether day-later feedback is still useful. Ordering is a minor implementation detail."},

{n:117,q:"Your pipeline builds a PROMPT variable and runs: claude -p --dangerously-skip-permissions --system-prompt “$PROMPT” < diff.txt. The reviews complete and return feedback, but Claude only comments on the piped diff text – it never reads surrounding files in the checked-out repository to understand broader context, even when the diff modifies a function called by many other modules. Which change to the invocation will cause Claude to read related files in the repository while still applying your custom review instructions?",
o:["Replace --system-prompt with --append-system-prompt so your review instructions are added to Claude Code's default prompt instead of overwriting the built-in guidance for using file-reading and code navigation tools.","Stop piping the diff via stdin and instead embed the diff contents inside the prompt string, so Claude Code treats the invocation as an agentic session rather than a stream-processing one.","Remove --system-prompt entirely and place the review instructions in a CLAUDE.md file at the repo root, since --system-prompt is incompatible with tool use under -p.","Keep --system-prompt and add --allowedTools “Read,Glob,Grep” so that the non-interactive -p mode permits file system tools that it otherwise disables."],
a:0,
e:"--system-prompt replaces Claude Code's default prompt, including the built-in guidance on using file-reading and navigation tools. --append-system-prompt adds your instructions while preserving that guidance. The tools were never disabled — Claude just lost the instructions telling it to use them."},

{n:118,q:"Your pipeline reviews every PR using a single API call with a static prompt containing the diff and full text of each changed file – unchanged files are not included. Reviews are posted asynchronously and do not block PR creation. Developers report that reviews consistently miss bugs involving cross-file interactions – for example, a PR renames a function's parameters but the review does not flag callers in unchanged files that still use the old argument order. Evaluation shows cross-file bugs account for 35% of production incidents from reviewed PRs. What is the most effective change to your review design?",
o:["Redesign the review as a turn-limited agentic task where the model can read files and search the codebase via tools, following references to verify cross-file findings.","Run parallel review passes per changed file with direct dependents included in each pass, then aggregate and deduplicate findings using a final summarization call.","Add chain-of-thought instructions asking the model to list all external references in the diff, then reason step-by-step about how each change might affect callers in other files.","Use static analysis to build a dependency graph of changed code, then expand the prompt to include all files within two dependency hops of any changed file."],
a:0,
e:"You cannot find callers in files you never sent. Give the model tools to search and read the repository so it can follow references. Reasoning harder about absent files still cannot see them, and fixed dependency-hop expansion is both bloated and arbitrary."},

{n:119,q:"A developer uses Claude Code to refactor a function during their development session. Before committing, they ask the same Claude session to review the code for issues. Later, a separate automated CI review catches several bugs that the same-session review missed. What best explains this discrepancy?",
o:["The CI review uses a more specific prompt tailored for catching bugs, while the developer's request was too general","The extended session length caused the context window to fill with conversation history, leaving less room for thorough analysis","The CI environment has access to the full codebase context while the local session only sees the current file","Claude retains context about its prior reasoning in the session, making it less likely to question its own decisions"],
a:3,
e:"Reviewing your own work in the same session inherits the assumptions that produced it. A fresh context evaluates the code as written rather than as intended — a good argument for separating generation and review."},

{n:120,q:"Your pipeline includes a release notes generation step that classifies and summarizes approximately 200 commits at the end of each weekly release cycle. Each commit is currently sent as a separate Messages API call using a Sonnet-tier Claude model. The release notes are not needed until the following morning (~12 hours of acceptable latency). Your team needs to reduce per-token API cost for this step while keeping the same model and prompts. Which approach satisfies all of these constraints?",
o:["Issue the 200 Messages API requests in parallel using concurrent connections, since concurrency lowers the per-token price charged by the API.","Concatenate all 200 commit messages into a single Messages API request and have the model return all summaries in one response, since fewer requests always reduces total token cost.","Submit the 200 requests to the Message Batches API with unique custom_ids and retrieve results once the batch ends, which applies a 50% discount to all input and output tokens.","Switch the summarization calls from the Sonnet-tier model to a Haiku-tier model to take advantage of Haiku's lower per-token rates."],
a:2,
e:"Latency tolerance of 12 hours plus a requirement to keep the same model and prompts is precisely the Batch API case: 50% off input and output. D changes the model, B changes the prompt structure, and concurrency has no effect on price."},

{n:121,q:"After deploying automated code review, developers report that approximately 35% of flagged findings are false positives falling into consistent patterns: style suggestions contradicting team conventions, security warnings for patterns safe in your deployment context, and performance suggestions that would degrade your specific use case. You want to reduce false positives while maintaining the ability to catch genuine issues. Which approach best enables the model to generalize its judgment to novel code patterns it has not seen before?",
o:["Create a comprehensive written specification of all patterns that should not be flagged, then include this full documentation in the system prompt.","Implement post-processing that uses keyword matching to filter out findings containing terms like “convention,” “context-dependent,” or “trade-off.”","Include few-shot examples in your prompt showing annotated code snippets that distinguish acceptable patterns from genuine issues in each category.","Add instructions to your system prompt to “be conservative,” “only flag definite issues,” and “consider that some patterns may be intentional.”"],
a:2,
e:"“Generalize to novel patterns” is the discriminator: annotated contrasting examples teach the underlying distinction, while an exhaustive list only covers enumerated cases. Vague hedging instructions suppress true positives too."},

{n:122,q:"Your automated review generates many findings per PR, but developer feedback shows roughly half are dismissed as “not worth addressing.” Analysis reveals dismissed findings are often technically accurate but involve minor style preferences or patterns acceptable in your codebase. Before adding infrastructure complexity, what prompt design change would most effectively reduce dismissals while maintaining detection of genuine issues?",
o:["Add explicit criteria defining which issues to report (bugs, security) versus skip (minor style, local patterns)","Add instructions asking Claude to rate each finding's confidence (1-10) and only include findings rated 8 or higher","Append instructions to “only report findings you are highly confident are genuine problems”","Implement a secondary classification model that filters Claude's findings based on predicted developer acceptance"],
a:0,
e:"The dismissed findings are accurate but not worth reporting, so the fix is defining relevance, not confidence — a correct style nit is high-confidence and still unwanted. D is the infrastructure the question asks you to avoid."},

{n:123,q:"The automated review consistently flags patterns your team uses intentionally – force-unwrapping optionals in test files, using large coordinator classes that follow your established architecture, and importing internally-maintained modules marked as deprecated in the public SDK. Developers are dismissing roughly 30% of all findings as project-specific false positives. Which approach prevents the model from generating these findings in the first place by supplying the project's conventions as persistent context on every review?",
o:["Have developers add inline suppress-comments at flagged lines and preprocess diffs to exclude suppressed lines before sending code to the model.","Build post-processing keyword filters that suppress findings containing terms like “force unwrap,” “large class,” or “deprecated import” before results reach developers.","Document the team's accepted patterns and intentional conventions in the project's CLAUDE.md file so the model receives this context during every review.","Configure the review to analyze only the changed lines in the diff without surrounding file context, reducing the amount of code the model evaluates per review."],
a:2,
e:"The question names the mechanism it wants: persistent project context on every review, which is CLAUDE.md. The filtering options suppress findings after generation, and D removes context the review needs."},
